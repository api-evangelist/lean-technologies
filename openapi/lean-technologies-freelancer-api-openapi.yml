openapi: 3.2.0
info:
  title: Insights API - Account Controls Freelancer API
  version: v2.0.0
  description: Offers overview signals and configurable thresholds on a connected account, returning a simple eligible/not-eligible verdict before any downstream process begins.
servers:
- url: https://sandbox.sa.leantech.me
  description: Sandbox
- url: https://api2.sa.leantech.me
  description: Production
security:
- bearerAuth: []
tags:
- name: Freelancer
  x-displayName: Freelancer
paths:
  /insights/v2/assets/freelancers/cashflows:
    servers: []
    get:
      operationId: getFreelancersCashflows
      summary: Get Freelancer Cashflow Data
      description: 'The Freelancer Cashflow Insights API provides access to freelancers'' certified income data.

        It offers insights into total and monthly cash inflows (filtered based on income verification logic) and outflows.

        '
      parameters:
      - name: entity_id
        in: query
        description: The `entity_id` you're querying for.
        required: true
        schema:
          type: string
          format: uuid
      - name: start_date
        in: query
        description: The start date in UTC (in the format YYYY-MM-DD) you want to query transactions for. Defaults to start_date of consent transaction range.
        required: false
        schema:
          type: string
          format: date
        x-field-extra-annotation: '@jakarta.validation.constraints.PastOrPresent'
      - name: async
        in: query
        description: 'When true the API will return a results_id which can be fetched from the /data/v2/results endpoint when ready. Note: it''''s recommended to use the sync flow (async=false) for all requests by adapting the data workflow for connected entities.'
        required: false
        schema:
          type: boolean
          default: false
        deprecated: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Result'
                - properties:
                    insights:
                      $ref: '#/components/schemas/FreelancerCashFlow'
                    type:
                      $ref: '#/components/schemas/InsightsResultType'
                  type: object
              examples:
                successfulFreelancerCashflow:
                  summary: Successful freelancer cashflow retrieval with insights
                  value:
                    status: OK
                    results_id: 085d1619-c8fb-488e-b362-ebc1abefc573
                    message: Data successfully retrieved
                    meta: null
                    timestamp: '2026-02-09T06:15:42.742984477Z'
                    status_detail: null
                    type: freelancer-cashflow
                    insights:
                      account_information:
                        account_holder_full_name: Ahmed Mohammed Al-Saud
                        account_holder_short_name: Ahmed
                        account_opening_date: '2023-01-15T00:00:00Z'
                      total:
                        current_balance_amount:
                          currency: SAR
                          amount: 186720.18
                        average_monthly_balance_amount:
                          currency: SAR
                          amount: 150127.95
                        inflows:
                          total_amount:
                            currency: SAR
                            amount: 1453.66
                          transactions_count: 3
                          periods:
                          - period: P12M
                            total_amount:
                              currency: SAR
                              amount: 1453.66
                            average_amount:
                              currency: SAR
                              amount: 121.14
                          - period: P6M
                            total_amount:
                              currency: SAR
                              amount: 1453.66
                            average_amount:
                              currency: SAR
                              amount: 242.28
                          - period: P3M
                            total_amount:
                              currency: SAR
                              amount: 1453.66
                            average_amount:
                              currency: SAR
                              amount: 484.55
                        outflows:
                          total_amount:
                            currency: SAR
                            amount: 113946.62
                          transactions_count: 291
                          periods:
                          - period: P12M
                            total_amount:
                              currency: SAR
                              amount: 113946.62
                            average_amount:
                              currency: SAR
                              amount: 9495.55
                          - period: P6M
                            total_amount:
                              currency: SAR
                              amount: 113946.62
                            average_amount:
                              currency: SAR
                              amount: 18991.1
                          - period: P3M
                            total_amount:
                              currency: SAR
                              amount: 113946.62
                            average_amount:
                              currency: SAR
                              amount: 37982.21
                      monthly_totals:
                      - month: 1
                        year: 2026
                        is_month_complete: true
                        inflows:
                          monthly_average_amount:
                            currency: SAR
                            amount: 0
                          total_amount:
                            currency: SAR
                            amount: 0
                          transactions_count: 0
                        outflows:
                          monthly_average_amount:
                            currency: SAR
                            amount: 0
                          total_amount:
                            currency: SAR
                            amount: 0
                          transactions_count: 0
                        balance:
                          monthly_average_amount:
                            currency: SAR
                            amount: 149213.14
                          initial_balance_amount:
                            currency: SAR
                            amount: 149213.14
                      - month: 2
                        year: 2026
                        is_month_complete: false
                        inflows:
                          monthly_average_amount:
