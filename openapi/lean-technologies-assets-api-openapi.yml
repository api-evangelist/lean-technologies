                          count: 68
                        net:
                          overall_amount:
                            currency: AED
                            amount: 5700
                          net_cashflow:
                            currency: AED
                            amount: 3700
                      credit_debit_behaviour:
                        periods:
                        - period: P12M
                          grand_average_credit_amount:
                            currency: AED
                            amount: 1700
                          grand_average_credit_count: 10
                          grand_average_debit_amount:
                            currency: AED
                            amount: 184.62
                          grand_average_debit_count: 70
