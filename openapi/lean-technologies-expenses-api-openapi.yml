openapi: 3.2.0
info:
  title: Lean Technologies Expenses API
  version: '1.0'
  description: 'Operations tagged Expenses across 3 of this provider''s published API definitions: lean-technologies-insights-openapi.yml, lean-technologies-ksa-enrichment-openapi.yml, lean-technologies-ksa-insights-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://sandbox.leantech.me
  description: Sandbox
- url: https://api2.leantech.me
  description: Production
- url: https://sandbox.sa.leantech.me
  description: Sandbox
- url: https://api2.sa.leantech.me
  description: Production / Pre-Live
tags:
- name: Expenses
  x-displayName: Expenses
paths:
  /insights/v2/expenses:
    servers: []
    get:
      operationId: getExpenses
      summary: Get Expenses
      description: Provides insights on the expenses (outflows) from a bank account.
      parameters:
      - name: entity_id
        in: query
        description: The `entity_id` you're querying for.
        required: true
        schema:
          type: string
          format: uuid
      - name: async
        in: query
        description: 'When true the API will return a results_id which can be fetched from the /data/v2/results endpoint when ready. Note: it''''s recommended to use the sync flow (async=false) for all requests by adapting the data workflow for connected entities.'
        required: false
        schema:
          type: boolean
          default: true
        deprecated: true
      - name: start_date
        in: query
        description: The start date in UTC (in the format YYYY-MM-DD) you want to query expenses for.
        required: false
        schema:
          type: string
          format: date
        x-field-extra-annotation: '@jakarta.validation.constraints.PastOrPresent'
      - name: expense_type
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ExpenseType'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - properties:
                    insights:
                      $ref: '#/components/schemas/Expenses'
                    type:
                      $ref: '#/components/schemas/InsightsResultType'
                  type: object
