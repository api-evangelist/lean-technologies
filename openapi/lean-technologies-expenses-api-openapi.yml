components:
  schemas:
    ExpensesTransaction:
      type: object
      properties:
        account_id:
          description: The account ID for the transaction
          type: string
          format: uuid
        transaction_id:
          description: The unique transaction identifier
          type: string
        transaction_information:
          description: Additional information about the transaction
          type:
          - string
          - 'null'
        booking_date_time:
          description: The date and time when the transaction was booked
          type: string
          format: date-time
        amount:
          description: The transaction amount
          type: number
        category:
          description: The expense category
          type: string
      required:
      - account_id
      - transaction_id
      - booking_date_time
      - amount
      - category
    ExpensesTotal:
      type: object
      properties:
        count:
          description: Number of expenses transactions within the time period.
          type: integer
          format: int32
        amount:
          description: Total expenses since start_date.
          type: number
          x-java-type: java.math.BigDecimal
        first_date_time:
          description: UTC datetime of first expense transaction since start_date.
          type: string
          format: date-time
        last_date_time:
