components:
  schemas:
    IncomeResponse:
      type: object
      properties:
        currency:
          type: string
          description: The 3 Letter ISO code denominating the currency that the salary is provided in. This will be local currency.
        total:
          type: object
          properties:
            count:
              type: integer
              description: Number of salary payments since start_date.
            amount:
              type: number
              description: Total salary since start_date.
            first_date_time:
              type: string
              description: UTC datetime of first salary payment since start_date.
              format: date-time
            last_date_time:
              type: string
              description: UTC datetime of last salary payment.
              format: date-time
            average_monthly_count:
              type: number
              description: Average number of salary payments per month since start_date.
            average_monthly_amount:
              type: number
              description: Average salary amount received per month since start_date.
            minimum_monthly_amount:
              type: object
              properties:
                month:
                  type: integer
                  description: 'Number of month within the year (e.g.: January is represented as 1 and December is represented as 12)'
                year:
                  type: integer
                amount:
                  type: number
                  description: Total salary for the month
              description: Minimum salary amount received in a month since start_date and month when this happened.
              required:
              - month
              - year
              - amount
            maximum_monthly_amount:
              type: object
              properties:
                month:
                  type: integer
                year:
                  type: integer
                amount:
                  type: number
                  description: Total salary for the month
              description: Maximum salary amount received in a month since start_date and month when this happened.
              required:
              - month
              - year
              - amount
          description: Insights on the salaries received since `start_date`
          required:
          - count
          - amount
          - first_date_time
          - last_date_time
          - average_monthly_count
          - average_monthly_amount
          - minimum_monthly_amount
          - maximum_monthly_amount
        monthly_totals:
          type: array
          items:
            type: object
            properties:
              month:
                type: integer
                description: 'Number of month within the year (e.g.: January is represented as 1 and December is represented as 12)'
              year:
                type: integer
              amount:
                type: number
                description: Total salary for the month.
              count:
                type: integer
                description: Number of salary transaction detected within the month.
              is_month_complete:
                type: boolean
                description: Determines if Lean retrieved the data for all days for the month. This will always be `true`, except for the first and last month retrieved.
            required:
            - month
            - year
            - amount
            - count
            - is_month_complete
        transactions:
          type: array
          items:
            type: object
            properties:
              account_id:
                type: string
                description: The id of the account where the salary transaction was credited into.
              transaction_id:
                type: string
                description: Unique identifier for a transaction.
              amount:
                type: object
                properties:
                  amount:
                    type: string
                    description: The value in the denominated currency.
                  currency:
                    type: string
                    description: ISO 3 letter code for the currency the amount is returned in.
                required:
                - amount
                - currency
              transaction_information:
                type: string
                description: Description of the transaction
              booking_date_time:
                type: string
                description: Date and time when the salary transaction is posted to the account.
                format: date-time
              income_source:
                type:
                - string
                - 'null'
                description: '[Not supported] Type and name of the source where the income comes from'
            required:
            - account_id
            - transaction_id
            - amount
            - transaction_information
            - booking_date_time
      required:
      - currency
      - total
      - monthly_totals
      - transactions
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
