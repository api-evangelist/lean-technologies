          $ref: '#/components/responses/UnsupportedByBankResponse'
      tags:
      - Income
      x-spring-response-entity: true
      security:
      - bearerAuth: []
components:
  schemas:
    InsightsResultType:
      description: type of insight
      type: string
      enum:
      - income
      - employment
      - cashflow
      - credits-obligations
      - non-credits-obligations
      - expenses
      - cash-balances
      - freelancer-cashflow
      - behaviors
      - cashflow-patterns
      - credit-assessments
      - account-controls
      - credit-obligations
    IncomeSourceDetails:
      type:
      - object
      - 'null'
      properties:
        type:
          description: The type of income source
          allOf:
          - $ref: '#/components/schemas/IncomeSourceType'
        name:
          description: The name of the employer or the source of the incoming transaction if available
          type: string
      x-class-extra-annotation: '@lombok.AllArgsConstructor'
    IncomeFactorsPeriod:
      type: object
      properties:
        period:
          description: The time period
          type: string
        income_variation:
          description: The variation in income for this period
          type: number
        average_income:
          allOf:
          - $ref: '#/components/schemas/CurrencyAmount'
    IncomeVerificationResponsePayload:
      type: object
      properties:
        salary:
          $ref: '#/components/schemas/IncomeCategoryPayload'
        non_salary:
          $ref: '#/components/schemas/IncomeCategoryPayload'
      additionalProperties: false
    IncomeType:
      type: string
      enum:
      - SALARY
      - NON_SALARY
      - ALL
    IncomeTransaction:
      type: object
      properties:
        account_id:
          description: The account ID associated with the transaction
          type: string
