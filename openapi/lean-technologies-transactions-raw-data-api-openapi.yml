components:
  schemas:
    DataResult:
      type: object
      allOf:
      - $ref: '#/components/schemas/Result'
      - type: object
        properties:
          refreshed_at:
            description: The datetime of when the data was refreshed
            type:
            - string
            - 'null'
            format: date-time
          type:
            description: The endpoint the original request was made to.
            type:
            - string
            - 'null'
    Currency:
      description: The ISO 3 letter currency code
      type: string
      examples:
      - AED
      pattern: ^[A-Z]{3}$
    TransactionChargeAmount:
      type: object
      properties:
        amount:
          description: Amount of money charged for the transaction.
          type: number
          format: decimal
        currency:
          description: Currency in which the charge amount is expressed.
          type: string
        charge_included:
          description: Indicates whether the charge is included in the transaction amount or is a separate charge.
          type: boolean
    PageMetadata:
      description: Metadata about the current page of results
      type: object
      properties:
        number:
          description: The current page being returned by the API
          type: integer
          format: int32
        size:
          description: The page size requested
          type: integer
          format: int32
        total_elements:
          description: The total number of elements in all pages
          type: integer
          format: int64
        total_pages:
          description: The total number of pages retrievable
          type: integer
          format: int32
        sort:
          description: Sort parameters applied to the results
          type: array
          items:
            type: string
      required:
      - number
      - size
      - total_elements
      - total_pages
    MerchantDetails:
      type: object
      properties:
        merchant_category_code:
          description: Category code conform to ISO 18245, related to the type of services or goods the merchant provides for the transaction.
          type: string
        merchant_name:
          description: Name by which the merchant is known and which is usually used to identify that merchant.
          type: string
    TransactionBalance:
      type: object
      properties:
        type:
          description: The type of balance for the transaction
          type: string
        credit_debit_indicator:
          $ref: '#/components/schemas/CreditDebitIndicator'
        amount:
          $ref: '#/components/schemas/CurrencyAmount'
      x-toBuilder: true
    ProprietaryBankTransactionCode:
      type: object
      properties:
        code:
          description: Proprietary bank transaction code to identify the underlying transaction.
          type: string
        issuer:
          description: Identification of the issuer of the proprietary bank transaction code.
          type: string
    Categorisation:
      description: Category enriched information when insights parameter is set to true.
      type: object
      properties:
        description_cleansed:
          description: A cleaned and standardized version of the transaction description.
          type: string
        category:
          description: High-level classification of the transaction including BANK_FEES_AND_CHARGES CHARITY EDUCATION ENTERTAINMENT GOVERNMENT GROCERIES HEALTH_AND_WELLBEING LOANS_AND_INVESTMENT RENT_AND_SERVICES RESTAURANTS_DINING RETAIL SALARY_AND_REVENUE TRANSFER TRANSPORT TRAVEL OTHER
          type: string
        category_confidence:
          description: Confidence of category expressed as a percentage between 0 and 1.
          type: number
          format: decimal
    PostalAddress:
      type: object
      properties:
        address_type:
          description: Identifies the nature of the postal address.
          type: string
        address_line:
          description: Information that locates and identifies a specific address.
          type: string
        building_number:
          description: Number that identifies the position of a building on a street.
          type: string
        country:
          description: Nation with its own government.
          type: string
        country_subdivision:
          description: Identifies a subdivision of a country such as state, region, county.
          type: string
        post_code:
          description: Identifier consisting of a group of letters and/or numbers that is added to a postal address.
          type: string
        street_name:
          description: Name of a street or thoroughfare.
          type: string
        town_name:
          description: Name of a built-up area, with defined boundaries, and a local government.
          type: string
    CurrencyAmount:
      type: object
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        amount:
          description: The amount of money in the currency specified.
          type: number
      required:
      - currency
      - amount
    FetchTransactionsResultV2:
      type: object
      allOf:
      - $ref: '#/components/schemas/DataResult'
      - properties:
          data:
            $ref: '#/components/schemas/TransactionsData'
        type: object
      x-toBuilder: true
    TransactionsData:
      type: object
      properties:
        type:
          description: The endpoint the original request was made to.
          type: string
          default: transactions
        transactions:
          description: An array of transactions associated with the account.
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        page:
          $ref: '#/components/schemas/PageMetadata'
      required:
      - type
      - page
    TransactionMutability:
      description: Specifies whether the transaction details may change after posting (e.g., pending transactions can update upon settlement).
      type: string
      enum:
      - IMMUTABLE
      - MUTABLE
      - UNSUPPORTED
    Result:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ResultStatus'
        results_id:
          description: The unique identifier for the request
          type: string
          format: uuid
        message:
          description: A message describing the status of the request
          type: string
        meta:
          description: Meta information about the request
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
        timestamp:
          description: The datetime of when the request was made
          type: string
          format: date-time
        status_detail:
          description: Additional information about the status
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/StatusDetail'
      required:
      - status
      - results_id
      - message
      - timestamp
    BankTransactionCode:
      type: object
      properties:
        code:
          description: Bank transaction code used by the bank to categorize the transaction.
          type: string
        sub_code:
          description: Sub-category of the bank transaction code providing further details.
          type: string
    TransactionAccountIdentifier:
      type: object
      properties:
        name:
          description: Name of the account, as assigned by the account servicing institution.
          type: string
        scheme_name:
          description: Name of the identification scheme, in a coded form as published in an external list.
          type: string
        identification:
          description: Identification assigned by an institution to identify an account.
          type: string
    CurrencyExchange:
      type: object
      properties:
        source_currency:
          description: Currency from which an amount is to be converted in a currency conversion.
          type: string
        target_currency:
          description: Currency into which an amount is to be converted in a currency conversion.
          type: string
        unit_currency:
          description: Currency in which the rate of exchange is expressed in a currency exchange.
          type: string
        exchange_rate:
          description: Factor used to convert an amount from one currency into another.
          type: number
          format: decimal
        contract_identification:
          description: Unique identification to unambiguously identify the foreign exchange contract.
          type: string
        quotation_date:
          description: Date and time at which an exchange rate is quoted.
          type: string
          format: date-time
        instructed_amount:
          $ref: '#/components/schemas/CurrencyAmount'
    CreditDebitIndicator:
      description: Indicates whether the balance is a credit or debit balance
      type: string
      enum:
      - CREDIT
      - DEBIT
      - UNSUPPORTED
    ResultStatus:
      description: The status of the request
      type: string
      enum:
      - OK
      - PENDING
      - FAILED
      - CONSENT_EXPIRED
      - RECONNECT_REQUIRED
      - PROCESSING_STARTED
    Transaction:
      type: object
      properties:
        entity_id:
          description: The unique identifier for the entity. Provided as a UUID.
          type: string
          format: uuid
        account_id:
          description: The account_id this transaction is related to.
          type: string
        transaction_id:
          description: A unique ID for the transaction used to help you tie data back to your systems
          type: string
        transaction_information:
          description: Include the raw unparsed transaction description from the bank
          type: string
        transaction_reference:
          description: A unique reference provided by the bank for the transaction when processed through a national payment system. As an example, it may be a reference code for the local payment scheme
          type: string
        credit_debit_indicator:
          $ref: '#/components/schemas/CreditDebitIndicator'
        amount:
          $ref: '#/components/schemas/CurrencyAmount'
        transaction_mutability:
          $ref: '#/components/schemas/TransactionMutability'
        booking_date_time:
          description: Date and time when a transaction entry is posted to an account.
          type: string
          format: date-time
        insights:
          $ref: '#/components/schemas/Categorisation'
        balance:
          $ref: '#/components/schemas/TransactionBalance'
        status:
          description: Status of the transaction (e.g., pending, booked).
          type: string
        statement_reference:
          description: A list of references for the statement if available.
          type: array
          items:
            type: string
        value_date_time:
          description: Date and time at which assets become available to the account owner (value date).
          type: string
          format: date-time
        index:
          description: Index position of the transaction in the sequence for the day.
          type: integer
        charge_amount:
          $ref: '#/components/schemas/TransactionChargeAmount'
        bank_transaction_code:
          $ref: '#/components/schemas/BankTransactionCode'
        card_instrument:
          $ref: '#/components/schemas/CardInstrument'
        merchant_details:
          $ref: '#/components/schemas/MerchantDetails'
        proprietary_bank_transaction_code:
          $ref: '#/components/schemas/ProprietaryBankTransactionCode'
        currency_exchange:
          $ref: '#/components/schemas/CurrencyExchange'
        creditor_account:
          $ref: '#/components/schemas/TransactionAccountIdentifier'
        creditor_agent:
          $ref: '#/components/schemas/Agent'
        debtor_account:
          $ref: '#/components/schemas/TransactionAccountIdentifier'
        debtor_agent:
          $ref: '#/components/schemas/Agent'
        local_time_zone:
          description: Local time zone
          type: string
        transaction_type:
          description: Transaction type
          type: string
          enum:
          - POS
          - E_COMMERCE
          - ATM
          - BILL_PAYMENTS
          - LOCAL_BANK_TRANSFER
          - SAME_BANK_TRANSFER
          - INTERNATIONAL_TRANSFER
          - TELLER
          - CHEQUE
          - OTHER
          - UNSUPPORTED
        sub_transaction_type:
          description: Sub transaction type
          type: string
          enum:
          - PURCHASE
          - REVERSAL
          - REFUND
          - WITHDRAWAL
          - WITHDRAWAL_REVERSAL
          - DEPOSIT
          - DEPOSIT_REVERSAL
          - MONEY_TRANSFER
          - NOT_APPLICABLE
          - UNSUPPORTED
          - REPAYMENTS
          - INTEREST
          - FEE
          - CHARGES
          - PROFIT
          - DISBURSEMENT
          - TAX
          - ADJUSTMENT
          - REWARDS
          - LEASE_REPAYMENT
        payment_modes:
          description: Mode of the payment
          type: string
          enum:
          - ONLINE
          - OFFLINE
          - BATCH
          - UNSUPPORTED
        flags:
          description: The list of flags for a transaction by the bank e.g., CASHBACK
          type: array
          items:
            type: string
      required:
      - account_id
      - transaction_id
      - amount
      - status
      x-toBuilder: true
    Agent:
      type: object
      properties:
        scheme_name:
          description: Name of the identification scheme, in a coded form as published in an external list.
          type: string
        identification:
          description: Unique and unambiguous identification of the agent.
          type: string
        name:
          description: Name by which the agent is known and which is usually used to identify that agent.
          type: string
        postal_address:
          $ref: '#/components/schemas/PostalAddress'
    StatusDetail:
      type:
      - object
      - 'null'
      properties:
        granular_status_code:
          description: Granular status code
          type:
          - string
          - 'null'
        status_additional_info:
          description: Additional information about the status
          type:
          - string
          - 'null'
    CardInstrument:
      type: object
      properties:
        authorization_type:
          description: Type of card authorization performed for the transaction.
          type: string
        card_scheme_name:
          description: Name of the card scheme.
          type: string
        identification:
          description: Identification assigned by an institution to identify the card instrument.
          type: string
        name:
          description: Name of the cardholder using the card.
          type: string
  examples:
    InternalServerErrorExample:
      summary: Internal server error response
      description: Response when an unexpected server error occurs
      value:
        results_id: 516adc40-af36-4284-bfba-46ec69dfe6d3
