components:
  schemas:
    Identification:
      type: object
      properties:
        type:
          description: Type of identification document
          anyOf:
          - $ref: '#/components/schemas/FreelancerIdentificationType'
        value:
          description: Value of the identification document
          type: string
      required:
      - type
      - value
    FreelancerIdentificationType:
      description: Types of identification documents accepted for freelancer verification
      type: string
      enum:
      - NATIONAL_ID
      - FREELANCER_NUMBER
    Name:
      type: object
      properties:
        ar:
          description: Name in Arabic
          type: string
        en:
          description: Name in English
          type: string
      required:
      - ar
      - en
    FreelancerVerificationType:
      description: 'Type of freelancer verification request. Determines pricing and data visibility. FULL_LIST: retrieve all certificates by National ID only. FULL: verify certificate ownership with National ID and Freelancer Number. BASIC: basic verification with National ID and Freelancer Number (reduced data).'
      type: string
      enum:
      - FULL_LIST
      - FULL
      - BASIC
    FreelancerCertificate:
      type: object
      properties:
        expiry_date:
          description: Expiry date of the certificate (null for rejected certificates)
          type:
          - string
          - 'null'
          format: date
        number:
          description: Certificate number (null for rejected certificates)
          type:
          - string
          - 'null'
        status:
          description: Current status of the certificate
          anyOf:
          - $ref: '#/components/schemas/CertificateStatus'
        revoked_at:
          description: Date when the certificate was revoked (null if not revoked)
          type:
          - string
          - 'null'
          format: date-time
        issue_date:
          description: Date when the certificate was issued (null for rejected certificates)
          type:
          - string
          - 'null'
          format: date
        speciality:
          description: Speciality information (null if not available)
          type:
          - object
          - 'null'
          properties:
            code:
              description: Speciality code
              type: string
            name:
              description: Speciality name in Arabic and English
              allOf:
              - $ref: '#/components/schemas/Name'
            category:
              $ref: '#/components/schemas/Category'
        canceled_at:
          description: Date when the certificate was canceled (null if not canceled)
          type:
          - string
          - 'null'
          format: date-time
      required:
      - expiry_date
      - number
      - status
      - issue_date
    FreelancerVerificationRequest:
      type: object
      properties:
        type:
          description: Type of freelancer verification. If not provided, defaults based on app configuration.
          anyOf:
          - $ref: '#/components/schemas/FreelancerVerificationType'
        identifications:
          description: Array of identification documents. FULL_LIST type requires NATIONAL_ID only. FULL type requires both NATIONAL_ID and FREELANCER_NUMBER. BASIC type requires both NATIONAL_ID and FREELANCER_NUMBER.
          type: array
          items:
            $ref: '#/components/schemas/Identification'
          maxItems: 2
          minItems: 1
      required:
      - identifications
    FreelancerVerificationResult:
      type: object
      properties:
        certificate_ownership_verified:
          description: Status of certificate ownership verification
          type: string
          enum:
          - VERIFIED
          - NOT_VERIFIED
          - NOT_CHECKED
        national_id:
          description: National ID of the freelancer (null if not provided)
          type:
          - string
          - 'null'
        national_id_expiry_date:
          description: Date in Hijri calendar format
          type:
          - string
          - 'null'
        name:
          description: Name of the freelancer in Arabic and English (null if not available)
          type:
          - object
          - 'null'
          properties:
            ar:
              description: Name in Arabic
              type: string
            en:
              description: Name in English
              type: string
        gender:
          description: Gender of the freelancer (null if not available)
          type:
          - string
          - 'null'
        certificate:
          description: Array of freelancer certificates
          type: array
          items:
            $ref: '#/components/schemas/FreelancerCertificate'
      required:
      - certificate_ownership_verified
      - certificate
    CertificateStatus:
      description: Possible statuses of a freelancer certificate
      type: string
      enum:
      - ACTIVE
      - EXPIRED
      - CANCELED
      - REVOKED
      - REJECTED
      - PENDING
      - CANCELED_BEFORE_ACTIVE
      - EDITED
      - SEND_IT_BACK
      - UNKNOWN
    Category:
      type: object
      properties:
        name:
          description: Category name in Arabic and English
          allOf:
          - $ref: '#/components/schemas/Name'
        code:
          description: Category code
          type: string
      required:
      - name
      - code
    FreelancerVerificationResponse:
      type: object
      properties:
        status:
          description: Status of the verification request
          type: string
          enum:
          - OK
          - FAILED
        results_id:
          description: Unique identifier for this verification result
          type: string
          format: uuid
        message:
          description: Human-readable message about the verification result
          type: string
        timestamp:
          description: Timestamp when the verification was processed
          type: string
          format: date-time
        meta:
          description: Additional metadata about the verification
          type:
          - object
          - 'null'
        status_detail:
          description: Detailed status information
          type:
          - string
          - 'null'
        verifications:
          $ref: '#/components/schemas/FreelancerVerificationResult'
      required:
      - status
      - results_id
      - message
      - timestamp
      - verifications
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
