openapi: 3.2.0
info:
  title: Lean API - Beneficiary Name Verification Freelancer Verification API
  description: API for retrieving beneficiary name from an IBAN
  version: v2.0.0
servers:
- url: https://sandbox.sa.leantech.me
  description: Sandbox
- url: https://api2.sa.leantech.me
  description: Production
security:
- bearerAuth: []
tags:
- name: Freelancer Verification
  description: Operations for verifying freelancer certificate information
  x-displayName: Freelancer Verification
paths:
