            schema:
              $ref: '#/components/schemas/FreelancerVerificationRequest'
            examples:
              withNationalId:
                summary: FULL - Request with both National ID and Freelancer Number
                value:
                  type: FULL
                  identifications:
                  - type: NATIONAL_ID
                    value: '1106972886'
                  - type: FREELANCER_NUMBER
                    value: FL-013988291
              fullListWithNationalId:
                summary: FULL_LIST - Retrieve all certificates by National ID
                value:
                  type: FULL_LIST
                  identifications:
                  - type: NATIONAL_ID
                    value: '1107454009'
              basicType:
                summary: BASIC - Basic verification with National ID and Freelancer Number
                value:
                  type: BASIC
                  identifications:
                  - type: NATIONAL_ID
                    value: '1106972886'
                  - type: FREELANCER_NUMBER
                    value: FL-013988291
