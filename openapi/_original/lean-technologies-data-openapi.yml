          description: The nickname for the account as set by the owner of the account. This name is known to the end-user
          type:
          - string
          - 'null'
        description:
          description: Specifies the description of the account sub-type.
          type:
          - string
          - 'null'
        opening_date:
          description: The date the account was opened.
          type:
          - string
          - 'null'
          format: date
        maturity_date:
          description: Maturity date of the account.
          type:
          - string
          - 'null'
          format: date-time
        account:
          description: A list of identifications for the account assigned by the Bank based on the Account Scheme Name
          type: array
          items:
            $ref: '#/components/schemas/AccountIdentification'
        servicer:
          description: Party that manages the account on behalf of the account owner, that is manages the registration and
            booking of entries on the account, calculates balances on the account and provides information about the account.
          allOf:
          - $ref: '#/components/schemas/Servicer'
      required:
      - account_id
      x-toBuilder: true
    ServicerSchemeName:
      description: Servicer identification scheme name
      type: string
      enum:
      - BICFI
      - OTHER
      - UNSUPPORTED
    Servicer:
      type: object
      properties:
        scheme_name:
