      description: "The Get Accounts endpoint retrieves a list of bank accounts that have been linked by a user via LinkSDK,\
        \ identified by their entity_id.\nEach account object contains fields such as account_id, account status, currency,\
        \ account_sub_type, account identifiers (such as IBAN, ACCOUNT_NUMBER, and NATIONAL_ID) and other data points related\
        \ accounts. \nYou can use the resulting account_ids to query additional financial data through other Lean APIs such\
        \ as transactions, balances, beneficiaries, and other data APIs.\n"
