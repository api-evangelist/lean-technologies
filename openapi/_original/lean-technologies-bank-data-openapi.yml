components:
  schemas:
    Identity:
      type: object
      properties:
        full_name:
          type: string
          description: The full legal name of the account holder.
        mobile_number:
          type: string
          description: The registered mobile number of the account holder.
        gender:
          type: string
          description: The registered gender of the account holder.
        national_identity_number:
          type: string
          description: The registered identity number of the account holder.
        birth_date:
          type: string
          description: The date of birth of the account holder.
        email_address:
          type: string
          description: The registered email address of the account holder.
        address:
          type: string
          description: The registered address of the account holder.
      required:
      - full_name
      - mobile_number
      - gender
      - national_identity_number
      - birth_date
      - email_address
      - address
    Accounts:
      type: object
      properties:
        account_id:
          type: string
          description: The unique identifier for the account. Provided as a UUID.
        account_number:
          type: string
          description: The account number for the account.
        name:
          type: string
          description: The product name of the account
        currency_code:
          type: string
          description: The ISO 3 letter currency code the account stores value in,
        type:
          type: string
          enum:
          - CURRENT
          - SAVINGS
          - CREDIT
          description: Indicates the type of account
        iban:
          type: string
          description: The IBAN for the account.
      required:
      - account_id
      - account_number
      - name
      - currency_code
      - type
      - iban
    Balances:
      type: object
      properties:
        account_id:
          type: string
          description: The `account_id` this balance is related to.
        balance:
          type: number
          description: The stored balance in the account a negative value may be returned for example for `CREDIT` accounts
            or current accounts in overdraft.
        currency_code:
          type: string
          maxLength: 3
          minLength: 3
          examples:
          - AED
          - SAR
          - USD
          description: The 3 letter ISO code for the denominated currency of the account balance.
        account_name:
          type: string
          description: The name of the account the balance has been fetched for
        account_type:
          type: string
          description: The type of the account
          enum:
          - CURRENT
          - SAVINGS
          - CREDIT
      required:
      - account_id
      - balance
      - currency_code
      - account_name
      - account_type
    CurrencyAmount:
      type: object
      properties:
        amount:
          type: number
          description: The value in the denominated currency.
        currency:
          type: string
          description: ISO 3 letter code for the currency the amount is returned in.
          minLength: 3
          maxLength: 3
      required:
      - amount
      - currency
    Address:
      type: object
      description: The address details extracted from the proof of address document.
      properties:
        address_type:
          type: string
          description: The type of address (e.g., residential, business).
        building_type:
          type: string
          description: 'The type of building, apartments or villa for example. '
        apartment_or_villa_number:
          type: string
          description: The apartment or villa number.
        building_name:
          type: string
          description: The name of the building.
        street:
          type: string
          description: The street name.
        area:
          type: string
          description: The area or neighborhood.
        town_name:
          type: string
          description: The town or city name where the address is located.
        region:
          type: string
          description: The region of the address.
        country:
          type: string
          description: The country where the address is located.
        post_code:
          type: string
          description: The postal code associated with the address.
        po_box:
          type: string
          description: The post office box number.
        street_address:
          type: string
          description: The street address extracted from the document.
        address_line:
          type: string
          description: The full address line as extracted from the document.
      required:
      - building_type
    Pagination:
      type: object
      properties:
        number:
          type: integer
          description: The current page being returned by the API
        size:
          type: integer
          description: The page size requested
        total_elements:
          type: integer
          description: The total number of elements in all pages
        total_pages:
          type: integer
          description: The total number of pages retrievable
      required:
      - number
      - size
      - total_elements
      - total_pages
    Entity:
      type: object
      properties:
        id:
          type: string
          description: The `entity_id`
          format: uuid
        customer_id:
          type: string
          description: Identifies which Customer owns the connection
          format: uuid
        bank_identifier:
          type: string
          description: Identifies the bank which has been connected
        permissions:
          type: object
          properties:
            identity:
              type: boolean
              description: Indicates access to read identity data
            accounts:
              type: boolean
              description: Indicates access to read accounts data
            balance:
              type: boolean
              description: Indicates access to read balance data
            transactions:
              type: boolean
              description: Indicates access to read transactions data
          required:
          - identity
          - accounts
          - balance
          - transactions
          description: Indicates which permissions have been granted by the user, this corresponds with the Data API calls
            you can make using the entity.
        bank_type:
          type: string
          enum:
          - RETAIL
          - CORPORATE
          description: 'Specifies whether the Entity is a Retail or Corporate owned account. '
      required:
      - id
      - customer_id
      - bank_identifier
      - permissions
      - bank_type
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
servers:
- url: https://sandbox.leantech.me
  description: Sandbox
- url: https://api2.leantech.me
  description: Production / Pre-live
security:
- bearer: []
