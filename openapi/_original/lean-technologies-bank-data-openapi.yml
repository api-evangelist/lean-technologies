                                    mobile_number:
                                      type: string
                                      description: The registered mobile number of the account holder.
                                    gender:
                                      type: string
                                      description: The registered gender of the account holder.
                                    national_identity_number:
                                      type: string
                                      description: The registered identity number of the account holder.
                                    birth_date:
                                      type: string
                                      description: The date of birth of the account holder.
                                    email_address:
                                      type: string
                                      description: The registered email address of the account holder.
                                    address:
                                      type: string
                                      description: The registered address of the account holder.
                                  required:
                                  - full_name
                                  - mobile_number
                                  - gender
                                  - national_identity_number
                                  - birth_date
                                  - email_address
                                  - address
                                  $ref: '#/components/schemas/Identity'
                              required:
                              - standard
                              - data
                      page:
                        $ref: '#/components/schemas/Pagination'
                      type:
                        type: string
                        description: The endpoint the original request was made to.
                    required:
                    - identities
                    - page
                    - type
                  results_id:
                    type: string
                    description: The ID for this result, this is used when retrieving results from the /results endpoint.
                  message:
                    type: string
                    description: Further explanation of the response
                  timestamp:
