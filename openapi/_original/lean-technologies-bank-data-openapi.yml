  /data/v2/identity:
    get:
      summary: Retrieve Identity
      deprecated: false
      description: Get the identity details of the account holder stored at the bank.
      operationId: fetchCurrentIdentity
      tags:
      - Raw Data
      parameters:
      - name: async
        in: query
        description: When `true` the API will only return a `results_id` which can be fetched from the `/results` endpoint
          when ready.
        required: false
        schema:
          default: false
          type: boolean
      - name: page
        in: query
        description: The page you're requesting - returns page 0 of a response if not specified.
        required: false
        schema:
          format: int32
          default: 0
          type: integer
      - name: size
        in: query
        description: The number of objects you want to return as a page size.
        required: false
        schema:
          format: int32
          default: 50
          maximum: 100
          type: integer
      - name: entity_id
        in: query
        description: The `entity_id` you're querying for.
        required: true
        schema:
          format: uuid
          type: string
      - name: meta
        in: query
        description: 'Additional data you would like to store against the request. Example: {"foo": "val"}'
        required: false
        schema:
          type: string
      - name: force_refresh
        in: query
        description: 'Ignore Lean''s caching and force a call to the bank. This may have unwanted performance issues. '
        required: false
        schema:
          default: false
          type: boolean
      - name: verbose
        in: query
        description: Shows `regional_data` values in responses when true. Defaults to `false`.
        required: false
        schema:
          default: false
          type: boolean
      - name: customer-ip
        in: header
        description: IP Address of the customer. Required to indicate that the user is currently on-session. When this value
          isn't supplied the request is treated as a background refresh. Banks may place limits on the number of background
          refreshes can be performed over 24 hours.
        required: false
        example: ''
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: The status of the request.
                    enum:
                    - OK
                    - FAILED
                    - PENDING
                    - CONSENT_EXPIRED
                  data:
                    type: object
                    properties:
                      identities:
                        type: array
                        items:
                          type: object
                          properties:
                            full_legal_name:
                              type: string
                            email_address:
                              type: string
                            mobile_number:
                              type: string
                            Address:
                              $ref: '#/components/schemas/Address'
                            regional_data:
                              type: object
                              properties:
                                standard:
                                  type: string
                                  description: A description of the standard the regional data is returned in formatted as
                                    "{ISO 3 Letter Country Code}.{Standard}.{Version}". In the UAE V2 API this will always
                                    return as `"ARE.LEAN.V1"`
                                data:
                                  properties:
                                    full_name:
