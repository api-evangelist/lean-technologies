openapi: 3.1.0
info:
  title: Insights API - Account Controls
  version: v2.0.0
  description: Offers overview signals and configurable thresholds on a connected account, returning a simple eligible/not-eligible
    verdict before any downstream process begins.
servers:
- url: https://sandbox.leantech.me
  description: Sandbox
- url: https://api2.leantech.me
  description: Production
paths:
  /insights/v3/account-controls:
    servers: []
    get:
      operationId: getAccountControls
      summary: Get Account Controls
      description: Offers overview signals and configurable thresholds on a connected account,  returning a simple eligible/not-eligible
        verdict before any downstream process begins
      parameters:
      - name: entity_id
        in: query
        description: The `entity_id` you're querying for.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - properties:
                    insights:
                      $ref: '#/components/schemas/AccountControlsPayload'
                    type:
                      $ref: '#/components/schemas/InsightsResultType'
                  type: object
              examples:
                Get_AccountControls:
                  summary: Successful get account controls
                  value:
                    status: OK
                    results_id: d982e1fd-aaf0-41fe-9f11-a4f67f4dc918
                    message: Data successfully retrieved
                    timestamp: '2026-06-29T12:07:48Z'
                    type: account-controls
                    insights:
                      account_controls:
                        signals:
                          account_age_months: 14
                          is_current_account: true
                          has_salary_income: true
                          has_non_salary_income: true
                          has_inflows: true
                          has_loan_repayments: true
                          has_loan_disbursements: false
                          is_expense_account: true
                        thresholds:
                          meets_minimum_average_salary: true
                          meets_minimum_average_non_salary: true
                          meets_minimum_account_age: true
                          meets_minimum_current_balance: false
                        verdict:
                          eligible: false
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightsResult'
              examples:
                InvalidParametersExample:
                  $ref: '#/components/examples/InsightsInvalidParametersExample'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightsResult'
              examples:
                UserPermissionsNotGrantedExample:
                  $ref: '#/components/examples/InsightsUserPermissionsNotGrantedExample'
                ConsentExpiredExample:
                  $ref: '#/components/examples/InsightsConsentExpiredExample'
                TransactionRangeNotGrantedExample:
                  $ref: '#/components/examples/InsightsTransactionRangeNotGrantedExample'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightsResult'
              examples:
                UnknownEntityExample:
                  $ref: '#/components/examples/InsightsUnknownEntityExample'
                DataNotFoundExample:
                  $ref: '#/components/examples/InsightsDataNotFoundExample'
        '408':
          description: Request Timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightsResult'
              examples:
                TimeoutExample:
                  $ref: '#/components/examples/InsightsTimeoutExample'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightsResult'
              examples:
                InternalServerErrorExample:
                  $ref: '#/components/examples/InsightsInternalServerErrorExample'
      tags:
      - Account Controls (New)
  /insights/v2/assets/cashflows:
    servers: []
    get:
      operationId: getCashflows
      summary: Get Cashflow
      description: 'The Cashflow API provides access to **Personal** and **Business** cash flow data. For personal accounts,
        it offers insights into monthly cash inflows, outflows, and net cash flow. For business accounts, it offers detailed
        insights on revenue, expenses, and net cash flow.

        You can use this API to evaluate financial stability, manage cash flow effectively, and assess the account holder''s
        ability to meet financial obligations.'
      parameters:
      - name: entity_id
        in: query
        description: The `entity_id` you're querying for.
        required: true
        schema:
          type: string
          format: uuid
      - name: async
        in: query
        description: 'When true the API will return a results_id which can be fetched from the /data/v2/results endpoint when
          ready. Note: it''''s recommended to use the sync flow (async=false) for all requests by adapting the data workflow
          for connected entities.'
        required: false
        schema:
          type: boolean
          default: true
        deprecated: true
      - name: start_date
        in: query
        description: The start date in UTC (in the format YYYY-MM-DD) you want to query transactions for.
        required: true
        schema:
          type: string
          format: date
        x-field-extra-annotation: '@jakarta.validation.constraints.PastOrPresent'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashFlowResult'
              examples:
