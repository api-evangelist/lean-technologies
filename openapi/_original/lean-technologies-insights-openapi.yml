components:
  schemas:
    ResultStatus:
      description: The status of the request
      type: string
      enum:
      - OK
      - PENDING
      - FAILED
      - CONSENT_EXPIRED
      - RECONNECT_REQUIRED
      - PROCESSING_STARTED
    StatusDetail:
      type:
      - object
      - 'null'
      properties:
        granular_status_code:
          description: Granular status code
          type:
          - string
          - 'null'
        status_additional_info:
          description: Additional information about the status
          type:
          - string
          - 'null'
    Result:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ResultStatus'
        results_id:
          description: The unique identifier for the request
          type: string
          format: uuid
        message:
          description: A message describing the status of the request
          type: string
        meta:
          description: Meta information about the request
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
        timestamp:
          description: The datetime of when the request was made
          type: string
          format: date-time
        status_detail:
          description: Additional information about the status
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/StatusDetail'
      required:
      - status
      - results_id
      - message
      - timestamp
    InsightsResultType:
      description: type of insight
      type: string
      enum:
      - income
      - employment
      - cashflow
      - credits-obligations
      - non-credits-obligations
      - expenses
      - cash-balances
      - freelancer-cashflow
      - behaviors
      - cashflow-patterns
      - credit-assessments
      - account-controls
      - credit-obligations
    Currency:
      description: The ISO 3 letter currency code
      type: string
      examples:
      - AED
      pattern: ^[A-Z]{3}$
    CurrencyAmount:
      type: object
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        amount:
          description: The amount of money in the currency specified.
          type: number
      required:
      - currency
      - amount
    CashFlowPatternMonthlyTotal:
      type: object
      properties:
        month:
          description: The month in YYYY-MM format.
          type: string
          examples:
          - 2026-01
        amount:
          description: The total amount for this month.
          type: object
          allOf:
          - $ref: '#/components/schemas/CurrencyAmount'
        transaction_count:
          description: The number of transactions in this month.
          type: integer
      required:
      - month
      - amount
      - transaction_count
    CashflowInterval:
      type: object
      properties:
        minimum_days:
          description: The minimum number of days between transactions.
          type: integer
        maximum_days:
          description: The maximum number of days between transactions.
          type: integer
      required:
      - minimum_days
      - maximum_days
    CashflowRegularity:
      type: object
      properties:
        days_of_month_numbers:
          description: The day(s) of the month when the transaction typically occurs.
          type: array
          items:
            type: integer
        days_of_month_names:
          description: The day name(s) of the week (e.g. Sunday, Monday) on which the transaction typically occurs.
          type: array
          items:
            type: string
        interval:
          $ref: '#/components/schemas/CashflowInterval'
        average_interval_days:
          description: The average number of days between transactions.
          type: number
        frequency:
          description: The frequency of the cashflow pattern.
          type: string
          enum:
          - DAILY
          - WEEKLY
          - BIWEEKLY
          - MONTHLY
          - QUARTERLY
          - ANNUALLY
        activity_status:
          description: 'The lifecycle status of the cashflow pattern within the analysis window: `STARTED_AND_ONGOING` — the
            pattern first appeared inside the window and is still active; `STARTED_AND_STOPPED` — the pattern both started
            and stopped within the window; `STOPPED` — the pattern predates the window and has since stopped; `ONGOING` —
            the pattern predates the window and is still active.'
          type: string
          enum:
          - STARTED_AND_ONGOING
          - STARTED_AND_STOPPED
          - STOPPED
          - ONGOING
      required:
      - days_of_month_numbers
      - days_of_month_names
      - interval
      - average_interval_days
      - frequency
      - activity_status
    CashflowPattern:
      type: object
      properties:
        credit_debit_indicator:
          description: Indicates whether the cashflow pattern is a credit or debit.
          type: string
          enum:
          - CREDIT
          - DEBIT
        primary_category:
          description: The primary category of the cashflow pattern.
          type: string
        secondary_category:
          description: The secondary category of the cashflow pattern.
          type: string
        counter_party:
          description: The merchant, employer, sender, or receiver associated with the cashflow pattern.
          type: string
        total_amount:
          description: The total amount across all transactions over the analysis period.
          type: object
          allOf:
          - $ref: '#/components/schemas/CurrencyAmount'
        transaction_count:
          description: The total number of transactions over the analysis period.
          type: integer
        monthly_totals:
          description: Monthly breakdown over the analysis period.
          type: array
          items:
            $ref: '#/components/schemas/CashFlowPatternMonthlyTotal'
        regularity:
          $ref: '#/components/schemas/CashflowRegularity'
      required:
      - credit_debit_indicator
      - primary_category
      - secondary_category
      - counter_party
      - total_amount
      - transaction_count
      - monthly_totals
      - regularity
    CashflowPatterns:
      description: Cashflow pattern analysis results.
      type: object
      properties:
        cashflow_patterns:
          description: List of identified cashflow patterns.
          type: array
          items:
            $ref: '#/components/schemas/CashflowPattern'
      required:
      - cashflow_patterns
    MonthlyAmount:
      type: object
      properties:
        month:
          description: The transaction month
          type: integer
          format: int32
        year:
          description: The transaction year
          type: integer
          format: int32
        amount:
          description: The transaction amount
          type: number
      x-class-extra-annotation: '@lombok.AllArgsConstructor'
