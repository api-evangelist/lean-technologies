  /insights/v2/income:
    servers: []
    post:
      operationId: verifyIncome
      summary: Get Income
      description: '`Get Income` endpoint provides essential income verification data for credit decisioning and underwriting
        processes. This API analyzes transaction history to produce reliable income insights for a specific borrower identified
        by their `entity_id`.


        The API returns comprehensive income information including categorization by source (salary vs. non-salary), monthly
        income patterns, and statistical analysis that helps lenders accurately assess an applicant''s ability to pay. These
        insights can be used for:


        - Verifying user stated income on loan applications

        - Calculating debt-to-income ratios with precision

        - Identifying income stability and irregularities

        - Supporting automated credit decisioning systems

        - Reducing manual verification workloads in underwriting


        Use this endpoint to streamline credit underwriting workflows, reduce time-to-decision, and make more informed lending
        decisions based on verified financial data.'
      parameters:
      - name: async
        in: query
        description: 'When true the API will return a results_id which can be fetched from the /data/v2/results endpoint when
          ready. Note: it''s recommended to use the sync flow (async=false) for all requests by adapting the data workflow
          for connected entities.'
        required: false
        schema:
          type: boolean
          default: false
        deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncomeVerificationRequestBody'
