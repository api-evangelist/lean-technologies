  /insights/v2/assets/balances:
    servers: []
    get:
      operationId: getBalances
      summary: Get Cash Balances
      description: 'The Cash Balances API provides a comprehensive view of both **Personal** or **Business** cash balances,
        offering insights into current, historical, and average balances.

        The data in this API allows financial companies to monitor liquidity trends and assess the financial health of bank
        accounts over time. Additionally, it provides information on the frequency and amount of contributions. You can use
        these insights to evaluate repayment capacity.

        > **"Supported for both retail and corporate accounts"**'
      parameters:
      - name: entity_id
        in: query
        description: The `entity_id` you're querying for.
        required: true
        schema:
          type: string
          format: uuid
      - name: async
        in: query
        description: 'When true the API will return a results_id which can be fetched from the /data/v2/results endpoint when
          ready. Note: it''''s recommended to use the sync flow (async=false) for all requests by adapting the data workflow
          for connected entities.'
