components:
  schemas:
    IncomeInsights:
      type: object
      properties:
        salary:
          $ref: '#/components/schemas/Salary'
          description: Salary income insights.
        non_salary:
          $ref: '#/components/schemas/NonSalary'
          description: Non-salary income insights.
    SalaryIncomeSource:
      type: object
      properties:
        type:
          type: string
          description: The type of source of the income. For salary it will always be `EMPLOYMENT`.
          enum:
          - EMPLOYMENT
        name:
          type:
          - string
          - 'null'
          description: The name of the employer.
      required:
      - name
      - type
    NonSalaryIncomeSource:
      type: object
      properties:
        type:
          type: string
          description: 'The type of source of the non-salary income. '
          enum:
          - 'GIG_ECONOMY '
          - RETIREMENT
          - 'HOUSING_BENEFIT '
          - 'UNEMPLOYMENT '
          - RENTAL
          - CASH_DEPOSIT
          - BONUS
          - TRANSFER_FROM_OWN_APPLICATION
        name:
          description: The name of the entity that provides the income.
          type: string
      required:
      - type
    IncomeRequest:
      description: ''
      required:
      - entity_id
      type: object
      properties:
        entity_id:
          description: The `entity_id` you are querying for. The entity needs to have permissions `accounts` and `transactions`.
          type: string
        start_date:
          format: date
          description: "The start date in UTC (in the format YYYY-MM-DD) you want to query transactions for. \nIf not provided,\
            \ we will default to 6 months before now."
          type: string
        estimated_monthly_income:
          description: 'Monthly income for the user that you have gathered from another source (e.g.: reported by the user).'
          type: number
        income_type:
          description: If you want to get salary or non-salary income or both. If you do not provide any value, it will default
            to ALL.
          enum:
          - SALARY
          - NON_SALARY
          - ALL
          type: string
    SalaryFactors:
      type: object
      properties:
        periods:
          type: array
          description: Array of income periods with their respective statistics
          items:
            type: object
            properties:
              period:
                type: string
                description: 'The time period for which the statistics are calculated. Allowed values: P3M (3 months), P6M
                  (6 months), P9M (9 months), P12M (12 months).'
                enum:
                - P3M
                - P6M
                - P9M
                - P12M
                examples:
                - P3M
                - P6M
                - P9M
                - P12M
                pattern: ^P(3|6|9|12)M$
                default: P3M
              income_variation:
                type: number
                description: The standard deviation of income amounts for the period
                minimum: 0
                format: double
              average_income:
                type: object
                description: The average income for the period
                properties:
                  currency:
                    type: string
                    description: The currency code
                    pattern: ^[A-Z]{3}$
                    examples:
                    - SAR
                  amount:
                    type: number
                    description: The amount in the specified currency
                    minimum: 0
                    format: double
                required:
                - currency
                - amount
                additionalProperties: false
            required:
            - period
            - income_variation
            - average_income
            additionalProperties: false
          minItems: 1
          maxItems: 4
        delta_min_max:
          type: number
          description: 'Ratio of the maximum salary amount to minimum salary amount '
          minimum: 0
          format: double
        average_monthly_income_change:
          type: number
          description: Average of Percentage Change Month on Month over the last 12Month
          format: double
      required:
      - periods
      - delta_min_max
      - average_monthly_income_change
      additionalProperties: false
    AmountObject:
      type: object
      properties:
        currency:
          type: string
          description: The currency in which the amount is represented.
        amount:
          type: number
          description: The decimal amount for the transaction
      description: The total amount for the category.
    employmentDetailsObject:
      type: object
      properties:
        bank_employer_name:
          type: string
          description: The name of the employer as it appears in bank transaction descriptions. This is the raw employer name
            extracted directly from salary payment transaction records.
        matched_reference_employer:
          type:
          - object
          - 'null'
          properties:
            name:
              type:
              - object
              - 'null'
              properties:
                en:
                  type:
                  - string
                  - 'null'
                  description: Employer name in English.
                ar:
                  type:
                  - string
                  - 'null'
                  description: Employer name in Arabic.
              description: Official name of the employer in English and Arabic.
            cr_number:
              type:
              - integer
              - 'null'
              description: Employer’s Commercial Registration (CR) number.
              format: int64
          description: Information about the verified employer entity that matched with the bank employer name. Value will
            be NULL if no matching stored in our database
          required:
          - name
          - cr_number
        salary_consistent:
          type: boolean
          description: Boolean indicator that determines if the salary payments from this employer follow a consistent pattern.
            true indicates stable payment patterns, while false indicates irregularity. This is calculated by comparing both
            date and amount variances against predefined thresholds (typically 5 days for dates and 1000 currency units for
            amounts).
        salary_date_variance:
          type: number
          description: A statistical measure of the variability in the timing of salary payments, expressed as the standard
            deviation of intervals (in days) between consecutive salary payments. Lower values indicate more consistent payment
            timing. A value of 0 means all payments were made at exactly the same interval.
          format: double
        salary_amount_variance:
          type: number
          description: A statistical measure of the variability in salary payment amounts, expressed as the standard deviation
            of payment amounts. Lower values indicate more consistent payment amounts. A value of 0 means all payments were
            exactly the same amount.
          format: double
        first_salary_date:
          type: string
          description: The timestamp of the earliest detected salary payment from this employer. This indicates when the employment
            relationship began or when the earliest available transaction record starts.
          format: date-time
      required:
      - bank_employer_name
      - matched_reference_employer
      - salary_consistent
      - salary_date_variance
      - salary_amount_variance
      - first_salary_date
