  /insights/v2/assets/balances:
    get:
      summary: Get Cash Balances
      deprecated: false
      description: "The Cash Balances API provides a comprehensive view of both **Personal** or **Business** cash balances,\
        \ offering insights into current, historical, and average balances. \n\nThe data in this API allows financial companies\
        \ to monitor liquidity trends and assess the financial health of bank accounts over time. Additionally, it provides\
        \ information on  the frequency and amount of contributions. You can use these insights to evaluate repayment capacity.\n\
        \n\nThis API is asynchronous, please read [this guide](https://docs.leantech.me/v2.0-KSA/docs/handling-asynchronous-requests)\
        \ for further information on how to fetch the results.\n\n> **\"Supported for both retail and corporate accounts\"\
        **\n> "
      operationId: getBalances
      tags:
      - Balances
      parameters:
      - name: entity_id
        in: query
        description: The `entity_id` you're querying for.
        required: true
        example: bc287977-2094-3bef-82a0-bae3fe8dadfe
        schema:
          type: string
      - name: start_date
        in: query
        description: The start date in UTC (in the format YYYY-MM-DD) you want to query expenses for.
        required: false
        example: '2024-09-01'
        schema:
          format: date
          type: string
      - name: async
        in: query
        description: When `true` the API will only return a `results_id` which can be fetched from the `/results` endpoint
          when ready.
        required: false
        example: 'false'
        schema:
          type: boolean
      - name: lean-app-token
        in: header
        description: Your Lean app token.
        required: true
        example: ad0832f0-76aa-4b7b-b267-1f002d7104df
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    description: The status of the results. For async requests, initially returns PENDING.
                    enum:
                    - OK
                    - FAILED
                    - PENDING
                    - CONSENT_EXPIRED
                    type: string
                  results_id:
                    type: string
                    description: The ID for this result, this is used when retrieving results from the `/results` endpoint.
                    format: uuid
                  message:
                    description: A message describing the status of the request.
                    type: string
                  meta:
                    type:
                    - string
                    - 'null'
                    description: Optional metadata associated with the result.
                  timestamp:
                    format: date-time
                    description: The timestamp with timezone offset indicating when the response was generated.
                    type: string
                  status_detail:
                    description: Further detail on the error if status=FAILED
                    $ref: '#/components/schemas/StatusDetailObject'
                  insights:
                    properties:
                      currency:
                        description: The 3 Letter ISO code denominating the currency that the cashflow is provided in. This
                          will be local currency (SAR in KSA).
                        type: string
                        examples:
                        - SAR
                      current_balance:
                        description: 'The current balance for the connected accounts. '
                        type: number
                        examples:
                        - '668782.33'
                      total:
                        $ref: '#/components/schemas/TotalBalances'
                        description: ''
                      monthly_totals:
                        type: array
                        items:
                          $ref: '#/components/schemas/MonthlyTotalsBalances'
                      balance_factors:
                        $ref: '#/components/schemas/balance_factors'
                    type: object
                required:
                - insights
                - status
                - results_id
                - message
                - meta
                - timestamp
                - status_detail
              example:
                status: OK
                results_id: 84ea61bf-ae3f-4002-8396-ce11e37cc798
