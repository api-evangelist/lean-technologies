    ExpensesTotalBreakdownCategory:
      type: object
      properties:
        by:
          description: Criteria by which we are breakdowning down the expenses.
          enum:
          - category
          type: string
        breakdowns:
          description: Breakdown of the expenses by category.
          type: array
          items:
            $ref: '#/components/schemas/ExpensesMonthlyBreakdownsCategory'
    ExpensesMonthlyTotals:
      type: object
      properties:
        month:
          description: 'Number of month within the year (e.g.: January is represented as 1 and December is represented as
            12)'
          type: integer
        year:
          description: Year.
          type: integer
        amount:
          description: Total expenses for the month.
          type: number
        count:
          description: Number of expense transactions in the month.
          type: integer
        is_month_complete:
          description: Determines if Lean retrieved the data for all days for the month. This will always be `true`, except
            for the first and last month retrieved.
          type: boolean
        breakdown:
          description: Breakdown of expenses by category.
          type: array
          items:
            $ref: '#/components/schemas/ExpensesMonthlyBreakdownCategory'
    ExpensesTotal:
      type: object
      properties:
        count:
          description: Number of expenses transactions since start_date.
          type: integer
        amount:
          description: Total expenses since start_date.
          type: number
        first_date_time:
          format: date-time
          description: UTC datetime of first expense transaction since start_date.
          type: string
        last_date_time:
          format: date-time
          description: UTC datetime of last expense transaction.
          type: string
        average_monthly_count:
          description: Average number of expenses transactions per month since start_date.
          type: number
        average_monthly_amount:
          description: Average expenses amount per month since start_date.
          type: number
        minimum_monthly_amount:
          $ref: '#/components/schemas/ExpensesMonthlyAggregate'
          description: Minimum expenses amount in a month since start_date and month when this happened.
        maximum_monthly_amount:
          $ref: '#/components/schemas/ExpensesMonthlyAggregate'
          description: Maximum expenses amount in a month since start_date and month when this happened.
        breakdown:
          description: Breakdown of expenses by category.
          type: array
          items:
            $ref: '#/components/schemas/ExpensesTotalBreakdownCategory'
    NonSalaryTransaction:
      type: object
      properties:
        account_id:
          description: The id of the account where the non-salary income transaction was credited into.
          type: string
        transaction_id:
          description: Unique identifier for a transaction
          type: string
        amount:
          $ref: '#/components/schemas/CurrencyAmount'
          description: Amount and currency of the transaction.
        transaction_information:
          description: Description of the transaction
          type: string
        booking_date_time:
          format: date-time
          description: Date and time when the non-salary income transaction is posted to the account.
          type: string
        income_source:
          $ref: '#/components/schemas/NonSalaryIncomeSource'
          description: Type and name of the source where the income comes from.
    SalaryTransaction:
      type: object
      properties:
        account_id:
          type: string
          description: The id of the account where the salary transaction was credited into.
          format: uuid
        transaction_id:
          description: Unique identifier for a transaction
          type: string
        transaction_information:
          description: Description of the transaction
          type: string
        booking_date_time:
          format: date-time
          description: Date and time when the salary transaction is posted to the account.
          type: string
        amount:
          type: number
          description: Amount the salary transaction.
        income_source:
          $ref: '#/components/schemas/SalaryIncomeSource'
          description: Type and name of the source where the income comes from.
      required:
      - account_id
      - transaction_id
      - amount
      - transaction_information
      - income_source
      - booking_date_time
    CurrencyAmount:
      type: object
      properties:
        amount:
          format: float
          description: The value in the denominated currency.
          type: number
        currency:
          description: ISO 3 letter code for the currency the amount is returned in.
          type: string
    NonSalaryFactors:
      type: object
      properties:
        periods:
          type: array
          description: Array of income periods with their respective statistics
          items:
            type: object
            properties:
              period:
                type: string
                description: 'The time period for which the statistics are calculated. Allowed values: P3M (3 months), P6M
                  (6 months), P9M (9 months), P12M (12 months).'
                enum:
                - P3M
                - P6M
                - P9M
                - P12M
                examples:
                - P3M
                - P6M
                - P9M
                - P12M
                pattern: ^P(3|6|9|12)M$
                default: P3M
              income_variation:
                type: number
                description: The standard deviation of income amounts for the period
                minimum: 0
                format: double
              average_income:
                type: object
                description: The average income for the period
                properties:
                  currency:
                    type: string
                    description: The currency code
                    pattern: ^[A-Z]{3}$
                    examples:
                    - SAR
                  amount:
                    type: number
                    description: The amount in the specified currency
                    minimum: 0
                    format: double
                required:
                - currency
                - amount
                additionalProperties: false
            required:
            - period
            - income_variation
            - average_income
            additionalProperties: false
          minItems: 1
          maxItems: 4
        delta_min_max:
          type: number
          description: 'Ratio of the maximum salary amount to minimum salary amount '
          minimum: 0
          format: double
        average_monthly_income_change:
          type: number
          description: Average of Percentage Change Month on Month over the last 12Month
          format: double
      required:
      - periods
      - delta_min_max
      - average_monthly_income_change
      additionalProperties: false
    balance_factors:
      type: object
      title: BalanceFactors
      description: Balance factors analysis for cash balance insights
      properties:
        periods:
          type: array
          description: List of balance periods with their average balances
          items:
            type: object
            properties:
              period:
                type: string
                description: The time period in ISO 8601 duration format
                enum:
                - P3M
                - P6M
                - P9M
                - P12M
                examples:
                - P3M
              average_balance:
                type: number
                description: The average balance for the period
                format: decimal
                examples:
                - 28630.95
            required:
            - period
            - average_balance
        balance_trend_average_month_on_month:
          type: number
          description: Average month-over-month balance trend percentage
          format: decimal
          examples:
          - 1817
        current_balance:
          type: number
          description: Current balance amount
          format: decimal
          examples:
          - 36211.63
        balance_trend:
          type: integer
          description: Number of times the balance increased month over month
          minimum: 0
          examples:
          - 7
        inflow_factors:
          type: object
          description: Analysis of credit (incoming) transactions
          properties:
            median_transaction_amount:
              type: number
              description: Median transaction amount
              format: decimal
              examples:
              - 53.93
            max_transaction_amount:
              type: number
              description: Maximum transaction amount
              format: decimal
              examples:
              - 21894
            min_transaction_amount:
              type: number
              description: Minimum transaction amount
              format: decimal
              examples:
              - 13.31
            weekday_transaction_count:
              type: integer
              description: Number of weekday transactions
              minimum: 0
              examples:
              - 131
            weekend_transaction_count:
              type: integer
              description: Number of weekend transactions
              minimum: 0
              examples:
              - 53
            average_time:
              type: number
              description: Average time between transactions in days
              format: decimal
              examples:
              - 6.83
            percent_greater_than_x:
              type: number
              description: Percentage of transactions greater than a threshold
              format: decimal
              minimum: 0
              maximum: 100
              examples:
              - 33
            recurring_average:
              type: number
              description: Average amount of recurring transactions
              format: decimal
              examples:
              - 0
            median_days:
              type: number
              description: Median number of days between transactions
              format: decimal
              examples:
              - 4
            percent_salary_transaction:
              type: number
              description: Percentage of transactions that are salary-related
              format: decimal
              minimum: 0
              maximum: 100
              examples:
              - 98
          required:
          - median_transaction_amount
          - max_transaction_amount
          - min_transaction_amount
          - weekday_transaction_count
          - weekend_transaction_count
          - average_time
          - percent_greater_than_x
          - recurring_average
          - median_days
          - percent_salary_transaction
        outflow_factors:
          type: object
          description: Analysis of debit (outgoing) transactions
          properties:
            median_transaction_amount:
              type: number
              description: Median transaction amount
              format: decimal
              examples:
              - 46
            max_transaction_amount:
              type: number
              description: Maximum transaction amount
              format: decimal
              examples:
              - 5000
            min_transaction_amount:
              type: number
              description: Minimum transaction amount
              format: decimal
              examples:
              - 0.08
            weekday_transaction_count:
              type: integer
              description: Number of weekday transactions
              minimum: 0
              examples:
              - 130
            weekend_transaction_count:
              type: integer
              description: Number of weekend transactions
              minimum: 0
              examples:
              - 53
            average_time:
              type: number
              description: Average time between transactions in days
              format: decimal
              examples:
              - 1
            percent_greater_than_x:
              type: number
              description: Percentage of transactions greater than a threshold
              format: decimal
              minimum: 0
              maximum: 100
              examples:
              - 20
            recurring_average:
              type: number
              description: Average amount of recurring transactions
              format: decimal
              examples:
              - 0
            median_days:
              type: number
              description: Median number of days between transactions
              format: decimal
              examples:
              - 1
            spike_transactions:
              type: array
              description: List of transactions that are considered spikes
              items:
                type: object
                properties:
                  month:
                    type: integer
                    description: Month of the spike transaction
                    minimum: 1
                    maximum: 12
                    examples:
                    - 11
                  year:
                    type: integer
                    description: Year of the spike transaction
                    examples:
                    - 2024
                  amount:
                    type: number
                    description: Amount of the spike transaction
                    format: decimal
                    examples:
                    - 15749.05
                required:
                - month
                - year
                - amount
          required:
          - median_transaction_amount
          - max_transaction_amount
          - min_transaction_amount
          - weekday_transaction_count
          - weekend_transaction_count
          - average_time
          - percent_greater_than_x
          - recurring_average
          - median_days
          - spike_transactions
        daily_net_cashflow_estimate:
          type: number
          description: Estimated daily net cash flow
          format: decimal
          examples:
          - 138.53
      required:
      - periods
      - balance_trend
      - balance_trend_average_month_on_month
      - current_balance
      - inflow_factors
      - outflow_factors
      - daily_net_cashflow_estimate
