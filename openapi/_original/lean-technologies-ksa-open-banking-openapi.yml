    OBTransactionTypeCode:
      description: Specifies the transaction type.
      type: string
      enum:
      - KSAOB.POS
      - KSAOB.ECommerce
      - KSAOB.ATM
      - KSAOB.BillPayments
      - KSAOB.LocalBankTransfer
      - KSAOB.SameBankTransfer
      - KSAOB.InternationalTransfer
      - KSAOB.Teller
      - KSAOB.Cheque
      - KSAOB.Other
    OBSubTransactionTypeCode:
