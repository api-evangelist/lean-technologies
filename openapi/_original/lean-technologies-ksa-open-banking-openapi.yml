      - CreditDebitIndicator
      - Status
      - BookingDateTime
      - Amount
    OBTransactionBalance:
      description: Set of elements used to define the balance of the account at the time of the transaction.
      type: object
      properties:
        CreditDebitIndicator:
          $ref: '#/components/schemas/OBCreditDebitCode'
        Type:
          $ref: '#/components/schemas/OBBalanceTypeCode'
        Amount:
          description: Amount of money of the cash balance.
          type: object
          allOf:
          - $ref: '#/components/schemas/OBAmount'
      required:
      - CreditDebitIndicator
      - Type
      - Amount
    OBCardInstrument:
      description: Set of elements to describe the card instrument used in the transaction.
      type: object
      properties:
        CardSchemeName:
          $ref: '#/components/schemas/OBCardSchemeCode'
        InstrumentType:
          $ref: '#/components/schemas/OBCardInstrumentTypeCode'
        Name:
          description: Name of the card product associated with the card instrument.
          type:
          - string
          - 'null'
        Identification:
          description: Identification assigned by an institution to identify the card instrument used in the transaction.
            This identification is known by the account owner, and may be masked.
          type:
          - string
          - 'null'
          maxLength: 16
          minLength: 1
      required:
      - CardSchemeName
      - InstrumentType
    OBMerchantDetails:
      description: Details of the merchant involved in the transaction.
      type: object
      properties:
        MerchantId:
          description: MerchantId.
          type:
          - integer
          - 'null'
        MerchantName:
          description: Name by which the merchant is known.
          type:
          - string
          - 'null'
          maxLength: 350
          minLength: 1
        MerchantCategoryCode:
          description: Category code (ISO 18245) conformed to by the merchant.
          type:
          - string
          - 'null'
          maxLength: 4
          minLength: 3
    OBBillDetails:
      description: Details of the bill payment associated with the transaction.
      type: object
      properties:
        BillerId:
          description: Unique identifier for the biller.
          type:
          - integer
          - 'null'
        BillNumber:
          description: Unique identifier for the bill.
          type:
          - string
          - 'null'
        BillPaymentType:
          description: Type of bill payment.
          allOf:
          - $ref: '#/components/schemas/OBBillPaymentTypeCode'
    OBCurrencyExchange:
      description: Set of elements used to provide details on the currency exchange.
      type: object
      properties:
        SourceCurrency:
          description: Currency from which an amount is to be converted in a currency conversion (ISO 4217).
          type: string
          pattern: ^[A-Z]{3,3}$
        TargetCurrency:
          description: Currency into which an amount is to be converted in a currency conversion (ISO 4217).
          type: string
          pattern: ^[A-Z]{3,3}$
        UnitCurrency:
          description: Currency in which the rate of exchange is expressed in a currency exchange (ISO 4217).
          type: string
          pattern: ^[A-Z]{3,3}$
        ExchangeRate:
          description: Factor used to convert an amount from the source currency into the target currency.
          type: number
        ContractIdentification:
          description: Unique identification to unambiguously identify the foreign exchange contract.
          type:
          - string
          - 'null'
          maxLength: 35
          minLength: 1
        QuotationDate:
          description: Date and time at which an exchange rate is quoted. ISO 8601 format.
          type:
          - string
          - 'null'
          format: date-time
        InstructedAmount:
          description: Amount of money to be moved between the debtor and creditor, before deduction of charges, in the source
            currency.
          type: object
          allOf:
          - $ref: '#/components/schemas/OBAmount'
      required:
      - SourceCurrency
      - TargetCurrency
      - UnitCurrency
      - ExchangeRate
      - InstructedAmount
    OBBankTransactionCode:
      description: Set of elements used to fully identify the type of underlying transaction resulting in an entry.
      type: object
      properties:
        Domain:
          description: Specifies the general family of the underlying transaction.
          type:
          - string
          - 'null'
        DomainCode:
          description: Specifies the sub-product family within a specific family.
          type:
          - string
          - 'null'
        Family:
          description: Specifies the family within a domain.
          type:
          - string
          - 'null'
        FamilyCode:
          description: Specifies the sub-family within a family.
          type:
          - string
          - 'null'
        SubFamily:
          description: Specifies the sub-family of a family of bank transactions.
          type:
          - string
          - 'null'
        SubFamilyCode:
          description: Specifies the code for a sub-family of a family of bank transactions.
          type:
          - string
          - 'null'
    OBProprietaryBankTransactionCode:
      description: Set of elements to fully identify a proprietary bank transaction code.
      type: object
      properties:
        Code:
          description: Proprietary bank transaction code to identify the underlying transaction.
          type: string
          maxLength: 35
          minLength: 1
        Issuer:
          description: Identification of the issuer of the proprietary bank transaction code.
          type:
          - string
          - 'null'
          maxLength: 35
          minLength: 1
      required:
