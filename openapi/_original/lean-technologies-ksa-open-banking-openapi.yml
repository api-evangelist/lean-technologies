      type: string
      enum:
      - KSAOB.Purchase
      - KSAOB.Reversal
      - KSAOB.Refund
      - KSAOB.Withdrawal
      - KSAOB.WithdrawalReversal
      - KSAOB.Deposit
      - KSAOB.DepositReversal
      - KSAOB.MoneyTransfer
      - KSAOB.NotApplicable
    OBTransactionFlag:
      description: Additional flag providing context about the transaction.
      type: string
      enum:
      - KSAOB.Cashback
      - KSAOB.Payroll
      - KSAOB.DirectDebit
      - KSAOB.StandingOrder
      - KSAOB.Loan
      - KSAOB.Dividend
    OBPaymentModeCode:
      description: Specifies the payment mode used for the transaction.
      type: string
      enum:
      - KSAOB.Online
      - KSAOB.Offline
      - KSAOB.Batch
    OBEntryStatusCode:
      description: Status of a transaction entry on the books of the account servicer.
      type: string
      enum:
      - KSAOB.Booked
      - KSAOB.Pending
      - KSAOB.Rejected
    OBTransactionMutabilityCode:
      description: Specifies the mutability of the transaction record.
      type: string
      enum:
      - KSAOB.Mutable
      - KSAOB.Immutable
    OBCardSchemeCode:
      description: Name of the card scheme.
      type: string
      enum:
      - KSAOB.AmericanExpress
      - KSAOB.Diners
      - KSAOB.Discover
      - KSAOB.GCC
      - KSAOB.MasterCard
      - KSAOB.UPI
      - KSAOB.VISA
      - KSAOB.mada
    OBCardInstrumentTypeCode:
      description: Specifies the type of card instrument used in the transaction.
      type: string
      enum:
      - KSAOB.ApplePay
      - KSAOB.madaPay
      - KSAOB.Contactless
      - KSAOB.MagStripe
      - KSAOB.Chip
      - KSAOB.Other
    OBBillPaymentTypeCode:
      description: Specifies the type of bill payment.
      type: string
      enum:
      - KSAOB.Post-Paid
      - KSAOB.AdvancePaymentForRoaming
      - KSAOB.Recharge
      - KSAOB.Renewal
      - KSAOB.RoamingDeposit
      - KSAOB.One-Off
      - KSAOB.RecurringPayment
    OBTransactionsMeta:
      description: Metadata relevant to the transactions resource.
      type: object
      properties:
        TotalPages:
          description: Total number of pages where a result set is paginated.
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        FirstAvailableDateTime:
          description: 'All dates in the JSON payloads are represented in ISO 8601 date-time format. All date-time fields
            in responses must include the timezone. An example is below: 2017-04-05T10:43:07+00:00'
          type:
          - string
          - 'null'
          format: date-time
        LastAvailableDateTime:
          description: 'All dates in the JSON payloads are represented in ISO 8601 date-time format. All date-time fields
            in responses must include the timezone. An example is below: 2017-04-05T10:43:07+00:00'
          type:
          - string
          - 'null'
          format: date-time
    OBChargeAmount:
      description: Active or historic currency and amount.
      type: object
      properties:
        Amount:
          description: A number of monetary units specified in an active currency where the unit of currency is explicit and
            compliant with ISO 4217.
          type: string
          pattern: ^\d{1,13}$|^\d{1,13}\.\d{1,5}$
        Currency:
          description: ISO 4217 currency code in which the amount is expressed.
          type: string
          examples:
          - SAR
          pattern: ^[A-Z]{3,3}$
        ChargeIncluded:
          description: 'If true then the value in the Amount has the ChargeAmount deducted from it

            '
          type: boolean
      required:
      - Amount
      - Currency
