        Frequency:
          description: 'Individual Definitions: NotKnown - NotKnown EveryDay - EveryDay EveryWorkingDay - EveryWorkingDay
            IntrvlDay:NoOfDay - An interval specified in number of calendar days IntrvlWkDay:IntvlWk:DayInWk - An interval
            specified in weeks, and the day within the week WkInMnthDay:WkInMnth:DayInWk - A monthly interval, specifying
            the week of the month and day within the week IntrvlMnthDay:IntvlMnth:DayInMnth - An interval specified in months,
            and the day within the month QtrDay:either (ENGLISH) - Quarterly (either ENGLISH).'
          type: string
