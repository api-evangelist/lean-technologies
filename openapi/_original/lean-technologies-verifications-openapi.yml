          type: string
          enum:
          - CONFIRMATION_OF_PAYEE_SERVICE
          - OPEN_BANKING
          - SARIE
          - SARIE_AND_CONFIRMATION_OF_PAYEE_SERVICE
        ibans:
          description: List of verified IBANs for the entity
          type: array
          items:
            $ref: '#/components/schemas/EntityVerificationResponseIban'
    EntityVerificationResponseIban:
      type: object
      properties:
        iban:
          description: Account IBAN
          type: string
        iban_ownership_verified:
          description: Whether the IBAN is owned by the entity
          type: boolean
    VerificationResponseEntityVerificationResponsePayload:
      allOf:
      - $ref: '#/components/schemas/Result'
      - type: object
        properties:
          verifications:
            $ref: '#/components/schemas/EntityVerificationResponsePayload'
    AvsIdentificationDto:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AvsIdentificationType'
        value:
          description: Identification value
          type: string
          minLength: 1
    AvsIdentificationType:
      description: "`FULL_NAME`: Complete name of the account holder \n`EMIRATES_ID`: Emirates identification number \n`TRADE_LICENCE`:\
        \ Trade licence number\n"
      type: string
    EntityIdentificationDto:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/EntityIdentificationType'
        value:
          description: Identification value
          type: string
          minLength: 1
    EntityIdentificationType:
      description: "`NATIONAL_ID`: National identification number \n`COMMERCIAL_REGISTRATION`: Commercial registration number\
        \ \n`UNIFIED_NUMBER`: Unified number \n`FREELANCER_NUMBER`: Freelancer number\n"
      type: string
      enum:
      - NATIONAL_ID
      - COMMERCIAL_REGISTRATION
      - UNIFIED_NUMBER
      - FREELANCER_NUMBER
    IbanVerificationBankConfiguration:
      description: Bank configuration for IBAN verification including availability and enablement status
      type: object
      properties:
        country_code:
          description: ISO 3166-1 alpha-2 country code where the bank is located
          type: string
        bank_code:
          description: Unique identifier code for the bank
          type: string
        bank_name:
          $ref: '#/components/schemas/Translation'
        availability:
          $ref: '#/components/schemas/IbanVerificationBankAvailability'
        application_enablement:
          $ref: '#/components/schemas/IbanVerificationEnablement'
      required:
      - country_code
      - bank_code
      - bank_name
      - availability
      - application_enablement
    IbanVerificationBankAvailability:
      description: Availability status of the bank for IBAN verification
      type: object
      properties:
        global:
          $ref: '#/components/schemas/IbanVerificationEnablement'
        account_type:
          $ref: '#/components/schemas/IbanVerificationAccountTypeAvailability'
      required:
      - global
      - account_type
    IbanVerificationAccountTypeAvailability:
      description: Availability status per account type for IBAN verification
      type: object
      properties:
        personal:
          $ref: '#/components/schemas/IbanVerificationMatchAvailability'
        freelancer:
          $ref: '#/components/schemas/IbanVerificationMatchAvailability'
        business:
          $ref: '#/components/schemas/IbanVerificationMatchAvailability'
      required:
      - personal
      - freelancer
      - business
    IbanVerificationMatchAvailability:
      description: Availability status for match and no-match scenarios
      type: object
      properties:
        match:
          $ref: '#/components/schemas/IbanVerificationEnablement'
        no_match:
          $ref: '#/components/schemas/IbanVerificationEnablement'
      required:
      - match
      - no_match
    IbanVerificationEnablement:
      description: Enablement status indicating whether a feature is enabled or disabled
      type: string
      enum:
      - ENABLED
      - DISABLED
    UpdateIbanVerificationBankConfigurationRequest:
      description: Request body for updating application-level bank configurations
      type: object
      properties:
        availabilities:
          description: List of bank availability configurations to update
          type: array
          items:
            $ref: '#/components/schemas/ApplicationBankAvailability'
      required:
      - availabilities
    ApplicationBankAvailability:
      description: Application-level bank enablement configuration
      type: object
      properties:
        country_code:
          description: ISO 3166-1 alpha-2 country code where the bank is located
          type: string
        bank_code:
          description: Unique identifier code for the bank
          type: string
        enablement:
          $ref: '#/components/schemas/IbanVerificationEnablement'
      required:
      - country_code
      - bank_code
      - enablement
    MatchingResult:
      description: Where `iban_ownership_verified` is false the matching attribute will identify whether there is a 'partial'
        or 'no match'
      type:
      - object
      - 'null'
      properties:
        type:
          description: Identifies whether there is a partial match or no match
          type: string
          enum:
          - PARTIAL
          - NO_MATCH
        score:
          description: Similarity score on a scale of 0 to 1, with 0 being no similarity and 1 being high similarity.
          type: number
          format: double
          maximum: 1
          minimum: 0
