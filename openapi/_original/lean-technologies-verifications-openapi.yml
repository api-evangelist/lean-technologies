components:
  schemas:
    VerificationResponseBeneficiaryNamePayload:
      allOf:
      - $ref: '#/components/schemas/Result'
      - type: object
        properties:
          verifications:
            $ref: '#/components/schemas/BeneficiaryNamePayload'
    BeneficiaryNamePayload:
      description: Beneficiary name and account status retrieved from the bank
      type: object
      properties:
        beneficiary_name:
          description: Name of the account holder
          type: string
        account_status:
          description: Status of the bank account
          type: string
      required:
      - beneficiary_name
      - account_status
    ResultStatus:
      description: The status of the request
      type: string
      enum:
      - OK
      - PENDING
      - FAILED
      - CONSENT_EXPIRED
      - RECONNECT_REQUIRED
      - PROCESSING_STARTED
    StatusDetail:
      type:
      - object
      - 'null'
      properties:
        granular_status_code:
          description: Granular status code
          type:
          - string
          - 'null'
        status_additional_info:
          description: Additional information about the status
          type:
          - string
          - 'null'
    Result:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ResultStatus'
        results_id:
          description: The unique identifier for the request
          type: string
          format: uuid
        message:
          description: A message describing the status of the request
          type: string
        meta:
          description: Meta information about the request
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
        timestamp:
          description: The datetime of when the request was made
          type: string
          format: date-time
        status_detail:
          description: Additional information about the status
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/StatusDetail'
      required:
      - status
      - results_id
      - message
      - timestamp
    CorporateVerificationResponse:
      allOf:
      - $ref: '#/components/schemas/Result'
      - type: object
        properties:
          verifications:
            $ref: '#/components/schemas/CorporateVerificationResult'
    CorporateVerificationResult:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/CompanyStatus'
        commercial_registry:
          type:
          - object
          - 'null'
          properties:
            national_number:
              description: Commercial Registration National Number
              type:
              - string
              - 'null'
            registration_number:
              description: Commercial Registration Number
              type:
              - string
              - 'null'
            version_number:
              description: Commercial Registry Version Number
              type:
              - integer
              - 'null'
        company_name:
          description: Company Name
          allOf:
          - $ref: '#/components/schemas/LocalizedText'
        name_language:
          type:
          - object
          - 'null'
          properties:
            id:
              description: Name language ID
              type:
              - integer
              - 'null'
            description:
              description: Company name language
              allOf:
              - $ref: '#/components/schemas/LocalizedText'
        commercial_registration_capital:
          description: Commercial registration capital
          type:
          - number
          - 'null'
        days_since_company_established:
          description: Days since company was established
          type:
          - integer
          - 'null'
        main_commercial_registry:
          type:
          - object
          - 'null'
          properties:
            is_main:
              description: Whether this is the main Commercial Registration
              type:
              - boolean
              - 'null'
            national_number:
              description: Main Commercial Registration National Number
              type:
              - string
              - 'null'
            registration_number:
              description: Main Commercial Registration Number
              type:
              - string
              - 'null'
        issue_date:
          $ref: '#/components/schemas/DatePair'
        in_liquidation_process:
          description: Whether the company is in a liquidation process
          type:
          - boolean
          - 'null'
        has_e_commerce:
          description: Whether the company engages in ecommerce
          type:
          - boolean
          - 'null'
          x-field-extra-annotation: '@JsonProperty("has_e_commerce")'
        headquarters:
          type:
          - object
          - 'null'
          properties:
            city_id:
              description: City ID
              type:
              - integer
              - 'null'
            city_name:
              description: Headquarters City
              allOf:
              - $ref: '#/components/schemas/LocalizedText'
        license:
          type:
          - object
          - 'null'
          properties:
            is_license_based:
              description: Whether the Commercial Registration is based on a license
              type:
              - boolean
              - 'null'
            issuer_national_number:
              description: License issuer national number
              type:
              - string
              - 'null'
            issuer_name:
              description: License issuer name
              allOf:
              - $ref: '#/components/schemas/LocalizedText'
        partners:
          type:
          - object
          - 'null'
          properties:
            nationality:
              description: Partner nationality
              allOf:
              - $ref: '#/components/schemas/LocalizedText'
        entity_type:
          $ref: '#/components/schemas/EntityType'
        confirmation_date:
          $ref: '#/components/schemas/DatePair'
        reactivation_date:
          $ref: '#/components/schemas/DatePair'
        suspension_date:
          $ref: '#/components/schemas/DatePair'
        deletion_date:
          $ref: '#/components/schemas/DatePair'
        contact_info:
          $ref: '#/components/schemas/ContactInfo'
        e_commerce:
          $ref: '#/components/schemas/ECommerceInfo'
        capital_information:
          $ref: '#/components/schemas/CapitalInfo'
        fiscal_year:
          $ref: '#/components/schemas/FiscalYear'
        parties:
          description: Company parties/partners
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Party'
        management:
          $ref: '#/components/schemas/ManagementInfo'
        liquidators:
          description: Company liquidators
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Liquidator'
        activities:
          description: Company activities
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Activity'
        contract_copy_number:
          description: Contract copy number
          type:
          - integer
          - 'null'
        contract_date:
          description: Contract date
          type:
          - string
          - 'null'
          format: date
        notification_channel:
          description: Notification method list
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/NotificationChannel'
        partner_decision:
          description: Partner decisions
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PartnerDecision'
        additional_decision_text:
          description: Additional decision text
          type:
          - string
          - 'null'
        set_aside_details:
          $ref: '#/components/schemas/SetAsideDetails'
        articles:
          description: Contract article list
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Article'
        additional_articles:
          description: Additional contract articles
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AdditionalArticle'
        addresses:
          description: National addresses of the establishment
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/NationalAddress'
      required:
      - contract_copy_number
      - contract_date
      - status
      - commercial_registry
      - company_name
      - name_language
