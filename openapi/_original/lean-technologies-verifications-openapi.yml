openapi: 3.1.0
info:
  title: Lean API - Beneficiary Name Verification
  description: API for retrieving beneficiary name from an IBAN
  version: v2.0.0
servers:
- url: https://sandbox.leantech.me
  description: Sandbox
- url: https://api2.leantech.me
  description: Production
