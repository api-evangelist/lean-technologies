  /verifications/v2/iban/banks:
    servers: []
    get:
      operationId: getIbanVerificationBankConfigurations
      summary: Get IBAN Verification Bank Configurations
      description: Retrieves the list of banks with their availability and enablement status for IBAN verification
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IbanVerificationBankConfiguration'
              example:
              - country_code: SAU
                bank_code: '15'
                bank_name:
                  en: AlBilad Bank
                  ar: بنك البلاد
                availability:
                  global: ENABLED
                  account_type:
                    personal:
                      match: ENABLED
                      no_match: ENABLED
                    freelancer:
                      match: ENABLED
                      no_match: DISABLED
                    business:
                      match: ENABLED
                      no_match: ENABLED
                application_enablement: ENABLED
              - country_code: ARE
                bank_code: '006'
                bank_name:
                  en: Emirates NBD
                  ar: الإمارات دبي الوطني
                availability:
                  global: ENABLED
                  account_type:
                    personal:
                      match: ENABLED
                      no_match: ENABLED
                    freelancer:
                      match: DISABLED
                      no_match: DISABLED
                    business:
                      match: ENABLED
                      no_match: ENABLED
                application_enablement: DISABLED
      tags:
      - Iban Verification
    put:
      operationId: updateIbanVerificationBankConfigurations
      summary: Update IBAN Verification Bank Configurations
      description: Updates the application-level bank enablement configurations for IBAN verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIbanVerificationBankConfigurationRequest'
            example:
              availabilities:
              - country_code: SAU
                bank_code: '15'
                enablement: ENABLED
              - country_code: ARE
                bank_code: '006'
                enablement: DISABLED
      responses:
        '200':
          description: OK
      tags:
      - Iban Verification
  /verifications/v2/entity:
    servers: []
    post:
      operationId: entityVerification
      summary: Verify Entity Ownership
      description: Verifies entity ownership by matching identification against bank records for multiple IBANs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityVerificationApiRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationResponseEntityVerificationResponsePayload'
              example:
                status: OK
                results_id: a894ede4-dd81-41fb-b52d-fb4fec16c16c
                message: Data successfully retrieved
                timestamp: '2023-10-18T13:15:32.251834909Z'
                verifications:
                  entity_ownership_verified: true
                  ibans:
                  - iban: SA2810000011100000461309
                    iban_ownership_verified: true
                  verification_method: OPEN_BANKING
      tags:
      - Entity Verification
