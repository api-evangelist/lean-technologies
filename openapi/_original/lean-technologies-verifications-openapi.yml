            Supported country codes for international AVS.

            - AE (United Arab Emirates)

            - AR (Argentina)

            - AT (Austria)

            - AU (Australia)

            - BD (Bangladesh)

            - BE (Belgium)

            - BG (Bulgaria)

            - BR (Brazil)

            - CL (Chile)

            - CN (China)

            - CO (Colombia)

            - CY (Cyprus)

            - DE (Germany)

            - EC (Ecuador)

            - EE (Estonia)

            - ES (Spain)

            - FI (Finland)

            - FR (France)

            - GB (United Kingdom)

            - GR (Greece)

            - HR (Croatia)

            - ID (Indonesia)

            - IE (Ireland)

            - IN (India)

            - IT (Italy)

            - KR (South Korea)

            - LT (Lithuania)

            - LU (Luxembourg)

            - LV (Latvia)

            - MT (Malta)

            - MX (Mexico)

            - MY (Malaysia)

            - NG (Nigeria)

            - NL (Netherlands)

            - NP (Nepal)

            - PE (Peru)

            - PK (Pakistan)

            - PL (Poland)

            - PT (Portugal)

            - SA (Saudi Arabia)

            - SI (Slovenia)

            - SK (Slovakia)

            - TR (Turkey)

            - UG (Uganda)

            - US (United States)

            - UY (Uruguay)

            - VN (Vietnam)

            - ZA (South Africa)

            '
