openapi: 3.1.0
info:
  title: UAE - V2
  description: Payouts API for UAE V2
  version: 1.0.0
servers:
- url: https://sandbox.leantech.me
  description: Sandbox
- url: https://api2.leantech.me
  description: Production
security:
- bearer: []
- bearerAuth: []
tags:
- name: Payouts
paths:
  /payouts/v1/payment:
    post:
      summary: 'Create Payout Payment '
      deprecated: false
      description: Create a payout payment
      operationId: createPayout
      tags:
      - Payouts
      parameters:
      - name: idempotency-key
        in: header
        description: The Idempotency Key used to mark the transaction call to the API.
        required: false
        example: ''
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payment_details:
                  type: array
                  items:
                    type: object
                    properties:
                      account_id:
                        type: string
                        description: Defines the `account_id` to send the money from
                      destination_details:
                        type: array
                        items:
                          type: object
                          properties:
                            payment_destination_id:
                              type: string
                              format: uuid
                              description: The Destination object to initiate the payment to
                            amount:
                              type: number
                              description: The amount to be transferred
                            currency:
                              type: string
                              description: Defines the `currency` of the payment
                              default: AED
                            external_reference:
                              type: string
                              description: Useful for tracking and reporting the transaction on your end. e.g You can enter
                                transaction ID of this payment maintained in your system
                            description:
                              type: string
                              description: Payment reference information
                              maxLength: 32
                            authorize_payment:
                              type: boolean
                              description: When set to `true` the payment will be automatically authorized by the authorizer
                                credentials in Payouts (requires an authorizer account to be set up in Payouts)
                              default: false
                          required:
                          - payment_destination_id
                          - amount
                          - description
                          - authorize_payment
                        description: Defines the payee account for the payment
                    required:
                    - account_id
                    - destination_details
                    - currency
                  description: An array of payments to be queued and authorized
              required:
              - payment_details
            example:
              payment_details:
              - account_id: string
                currency: AED
                destination_details:
                - payment_destination_id: 5fd95d40-9ea5-4678-8ffb-6b597f21965b
                  amount: 100
                  currency: AED
                  description: string
                  authorize_payment: false
      responses:
        '200':
          description: Payment initiated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  end_user_id:
                    type: string
                    description: Internal ID of the credentials used to queue the payment, for audit purposes.
                  payouts_payment_details:
                    type: array
                    items:
                      type: object
                      properties:
                        payment_intent_id:
                          type: string
                          description: The related Payment Intent
                        payment_id:
                          type: string
                          nullable: true
                          description: The related Payment
                        initiate_payment_task_id:
                          type: string
                          description: Informative ID for tracing a payout in Lean. Used when debugging a payout with your
                            support representative.
                        account_number:
                          type: string
                          description: Account number which is performing the payment
                        iban:
                          type: string
                          description: IBAN of the sending account
                        destination_details:
                          type: array
                          items:
                            type: object
                            properties:
                              destination_id:
                                type: string
                                description: The unique identifier for the destination
                              amount:
                                type: integer
                                description: Amount paid out
                              currency:
                                type: string
                                description: Currency of the transaction
                              payment_status:
                                type: string
                                description: Status of the payment
                              recipient_details:
                                type: object
                                properties:
                                  account_number:
                                    type: string
                                    description: Account number of the destination
                                  iban:
                                    type: string
                                    description: Full IBAN of the destination
                                  name:
                                    type: string
                                    description: Associated name of the destination
                                required:
                                - account_number
                                - iban
                                - name
                                description: Account details of the receiving account
                            required:
                            - destination_id
                            - amount
                            - currency
                            - payment_status
                            - recipient_details
                          description: Details of the receiving account
                        bank_identifier:
                          type: string
                          description: Bank Identifier of the sender's account
                      required:
                      - payment_intent_id
                      - bank_identifier
                required:
                - end_user_id
                - payouts_payment_details
              example:
                end_user_id: 560d6943-fa8e-4dd9-9717-50025bf2feae
                payouts_payment_details:
                - payment_intent_id: c97ccfea-b828-4850-bfe4-a06acfbb024b
                  initiate_payment_task_id: c4d5d3a9-f1bd-4361-9aff-42d4c7a9c3d0
                  account_number: '338247974759251'
                  iban: AE480484338247974759251
                  destination_details:
                  - destination_id: 2dac22a7-e168-454d-960b-7dfaddab6a54
                    amount: 100
                    currency: AED
                    payment_status: CREATED
                    recipient_details:
                      account_number: '1015000000601'
                      iban: AE760260001015000000601
                      name: Al Fulani
                  bank_identifier: LEAN_SME_MB1_UAE
          headers: {}
      security:
      - bearer: []
  /payouts/v1/payments:
    get:
      summary: List Payouts
      deprecated: false
      description: List payout payments
      operationId: getPayouts
      tags:
      - Payouts
      parameters:
      - name: page_number
        in: query
        description: The page number.
        required: false
        schema:
          type: integer
          default: 0
      - name: page_size
        in: query
        description: The number of Payout payments to return per page.
        required: false
        schema:
          type: integer
          default: 50
      - name: amount_min
        in: query
        description: The lower bound limit on the amount value for Payout payments.
        required: false
        schema:
          type: number
          format: double
      - name: amount_max
        in: query
        description: The upper bound limit on the amount value for Payout payments.
        required: false
        schema:
          type: number
          format: double
      - name: from
        in: query
        description: A DateTime in ISO-8601 format as the lower bound limit on the created_at value for Payout payments.
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: A DateTime in ISO-8601 format as the upper bound limit on the created_at value for Payout payments.
        required: false
        schema:
          type: string
          format: date-time
      - name: from_updated_at
        in: query
        description: A DateTime in ISO-8601 format as the lower bound limit on the updated_at value for Payout payments.
        required: false
        schema:
          type: string
          format: date-time
      - name: to_updated_at
        in: query
        description: A DateTime in ISO-8601 format as the upper bound limit on the updated_at value for Payout payments.
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      type: object
                      properties:
                        recipient_name:
                          type: string
                        recipient_bank_name:
                          type: string
                        recipient_iban:
                          type: string
                        description:
                          type: string
                        currency:
                          type: string
                        amount:
                          type: number
                        created_at:
                          type: string
                        payment_intent_id:
                          type: string
                        payment_id:
                          type: string
                        auto_authorized:
                          type: boolean
                        status:
                          type: string
                          enum:
                          - AWAITING_AUTHORIZATION
                          - PENDING_WITH_BANK
                          - ACCEPTED_BY_BANK
                          - FAILED
                      required:
                      - recipient_name
                      - recipient_bank_name
                      - recipient_iban
                      - description
                      - currency
                      - amount
                      - created_at
                      - payment_intent_id
                      - auto_authorized
                      - status
                      - payment_id
                  number:
                    type: integer
                    description: Current page number
                  size:
                    type: integer
                    description: Size of the page
                  total_elements:
                    type: integer
                    description: Total number of elements across all pages
                  pageable:
                    type: object
                    properties:
                      sort:
                        type: object
                        properties:
                          empty:
                            type: boolean
                            description: Response is empty
                          sorted:
                            type: boolean
                            description: Response is sorted
                          unsorted:
                            type: boolean
                            description: Response is unsorted
                        required:
                        - empty
                        - sorted
                        - unsorted
                        description: Sorting information
                      offset:
                        type: integer
                      page_size:
                        type: integer
                        description: Maximum size of a page of results
                      page_number:
                        type: integer
                        description: Current page number
                      paged:
                        type: boolean
                        description: Response is paged
                      unpaged:
                        type: boolean
                        description: Response is not paged
                    required:
                    - sort
                    - offset
                    - page_size
                    - page_number
                    - paged
                    - unpaged
                  last:
                    type: boolean
                    description: Is this the last page of the response
                  total_pages:
                    type: integer
                    description: Total number of available pages
                  first:
                    type: boolean
                    description: Is this the first page of the response
                  number_of_elements:
                    type: integer
                    description: Number of elements in the response
                  empty:
                    type: boolean
                    description: Is the response empty
                required:
                - content
                - number
                - size
                - total_elements
                - pageable
                - last
                - total_pages
                - first
                - number_of_elements
                - empty
              example:
                content:
                - recipient_name: SHINRA ELECTRICITY
                  recipient_bank_name: SHINRA LTD.
                  recipient_iban: AE04033000001XXXXXXXXXX
                  description: INV001
                  currency: AED
                  amount: 21.18
                  created_at: '2023-08-21T14:11:35.882645Z'
                  payment_intent_id: 7d496fab-4ff5-4221-85d7-43e5af28efdb
                  payment_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  auto_authorized: false
                  status: ACCEPTED_BY_BANK
                number: 0
                size: 20
                total_elements: 1
                pageable:
                  sort:
                    empty: true
                    sorted: false
                    unsorted: true
                  offset: 0
                  page_size: 20
                  page_number: 0
                  paged: true
                  unpaged: false
                last: true
                total_pages: 1
                first: true
                number_of_elements: 1
                empty: false
          headers: {}
      security:
      - bearer: []
  /payouts/v1/payments/{intent_id}/history:
    get:
      summary: Get Payment History
      deprecated: false
      description: Get payment history for a payment intent
      operationId: getPaymentHistory
      tags:
      - Payouts
      parameters:
      - name: intent_id
        in: path
        description: Payment intent ID
        required: true
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      type: object
                      properties:
                        payment_id:
                          type: string
                          description: The Payment ID
                        events:
                          type: array
                          items:
                            type: object
                            properties:
                              event:
                                type: string
                                description: Either `payment.created` or `payment.updated`
                              status:
                                type: string
                                description: The status at the time of the event
                                enum:
                                - PENDING_WITH_BANK
                                - AWAITING_AUTHORIZATION
                                - FAILED
                                - ACCEPTED_BY_BANK
                              post_initiation_status:
                                type: string
                                description: The current post-initiation status of the payment
                              published_at:
                                type: string
                                description: Timestamp the event was published
                            required:
                            - event
                            - status
                            - published_at
                      required:
                      - payment_id
                      - events
                  page:
                    type: object
                    properties:
                      number:
                        type: integer
                        example: 0
                      size:
                        type: integer
                        example: 10
                      total_elements:
                        type: integer
                        example: 1
                      total_pages:
                        type: integer
                        example: 1
                      sort:
                        type: object
                        nullable: true
                        description: Sorting information, may be null
                required:
                - content
                - page
              example:
                content:
                - payment_id: a5a10ac9-c714-4f17-a74f-1a28152c2837
                  events:
                  - event: payment.updated
                    status: ACCEPTED_BY_BANK
                    published_at: '2025-10-30T07:18:51.859454Z'
                    post_initiation_status: PROCESSED
                  - event: payment.created
                    status: AWAITING_AUTHORIZATION
                    published_at: '2025-10-30T07:15:02.507872Z'
                    post_initiation_status: 'null'
                page:
                  number: 0
                  size: 10
                  total_elements: 1
                  total_pages: 1
                  sort: null
      security:
      - bearer: []
  /payouts/v1/{payment_id}:
    get:
      summary: Get Payouts
      deprecated: false
      description: Fetch a single payment
      operationId: getPaymentById
      tags:
      - Payouts
      parameters:
      - name: payment_id
        in: path
        description: The unique identifier of the payment
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The unique identifier for this payment.
                    format: uuid
                  payment_intent_id:
                    type: string
                    description: The Payment Intent identifier responsible for generating the Payment.
                    format: uuid
                  payment_source_id:
                    type: string
                    description: The identifier for the payment source object from which the payment was initiatied.
                    format: uuid
                  sender_details:
                    type: object
                    properties:
                      account_number:
                        type: string
                      iban:
                        type: string
                      name:
                        type: string
                    required:
                    - account_number
                    - iban
                    - name
                    description: The account details for the customer sending the payment. Includes account number, name of
                      the account holder and IBAN.
                  recipient_details:
                    type: object
                    properties:
                      account_number:
                        type: string
                      iban:
                        type: string
                      name:
                        type: string
                    required:
                    - account_number
                    - iban
                    - name
                    description: Details for the recipient of the Payment, generated from the details available in the payment_destination.
                  amount:
                    type: number
                    description: The amount the charge was initiated for.
                  currency:
                    type: string
                    description: The currency the payment was initiated with.
                  description:
                    type: string
                    description: The description submitted to the bank as a reference when initiating a payment. Can be used
                      for reconciliation. By default this value is a the Payment Intent UUID without hyphens but you can also
                      specify the description upon creation of a payment intent.
                  submission_timestamp:
                    type: string
                    description: The time the Payment Initiation was submitted.
                  initiation_timestamp:
                    type: string
                    description: The time the Payment Initiation was started.
                  status:
                    type: string
                    description: 'The current status of the payment - see Payments Errors for a list of available MFAs. '
                    enum:
                    - AUTHORISATION_FAILED
                    - FAILED
                    - PENDING_WITH_BANK
                    - ACCEPTED_BY_BANK
                  post_initiation_status:
                    type: string
                    description: The current post-initiation status of the payment
                  bank_transaction_reference:
                    type: string
                    description: The transaction reference number supplied by the initiating bank on successful initiation
                      of a transfer. Can be used for reconciliation.
                  granular_status_code:
                    type: string
                    description: Detailed status code of the payment.
                  status_additional_details:
                    type: string
                    description: Additional details about the status of the payment.
                required:
                - id
                - payment_intent_id
                - payment_source_id
                - sender_details
                - recipient_details
                - amount
                - currency
                - description
                - submission_timestamp
                - initiation_timestamp
                - status
                - post_initiation_status
                - bank_transaction_reference
                - granular_status_code
                - status_additional_details
              example:
                id: 88c4d3e8-b80c-cd46-ac56-f084879744d6
                payment_intent_id: 30caf494-d6e0-d83e-907b-9393361c3895
                payment_source_id: 8d98c54d-b11f-4f39-52bb-6065dc0f4749
                sender_details:
                  account_number: 0101929293
                  iban: AE132353311P10164V8R3
                  name: Dwight Schrute
                recipient_details:
                  account_number: 0192929827
                  iban: AE23QQWD1004305268319738
                  name: Michael Gary Scott
                amount: 3448.38
                currency: AED
                description: 30caf494d6e0d83e907b9393361c3895
                submission_timestamp: '2024-09-19T11:43:08.933Z'
                initiation_timestamp: '2024-09-19T11:43:17.683Z'
                status: ACCEPTED_BY_BANK
                post_initiation_status: PROCESSED
                bank_transaction_reference: WD100430526831
                granular_status_code: SUCCESS
                status_additional_details: Payment processed successfully
          headers: {}
      security:
      - bearer: []
  /payouts/v1/intents/{payment_intent_id}:
    get:
      summary: Get Payout Intent
      deprecated: false
      description: The Payment intent is the contract between your backend and Lean to certify that you will request a payment
        from your customer of a specified amount and currency. In order to initiate a payment, the `payment_intent_id` must
        be provided into the `pay()` method of the LinkSDK.
      operationId: getPaymentIntentById
      tags:
      - Payouts
      parameters:
      - name: payment_intent_id
        in: path
        description: ''
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment_intent_id:
                    type: string
                    format: uuid
                    description: The unique identifier for the Payment Intent.
                  customer_id:
                    type: string
                    description: The Customer object associated with the Payment Intent.
                  amount:
                    type: number
                    description: The amount that should be charged to the customer.
                    format: float
                  currency:
                    type: string
                    minLength: 3
                    maxLength: 3
                    examples:
                    - AED
                    - USD
                    description: The currency that the customer will make the payment in.
                  description:
                    type: string
                    description: The description submitted to the bank as a reference when initiating a payment. Can be used
                      for reconciliation. By default this value is a the Payment Intent UUID without hyphens but you can also
                      specify the description upon creation of a payment intent.
                  external_reference:
                    type: string
                    description: 'Useful for tracking and reporting the transaction on your end. '
                  payment:
                    type: object
                    properties:
                      id:
                        type: string
                        description: The unique identifier for this payment.
                        format: uuid
                      payment_intent_id:
                        type: string
                        description: The Payment Intent identifier responsible for generating the Payment.
                        format: uuid
                      payment_source_id:
                        type: string
                        description: The identifier for the payment source object from which the payment was initiatied.
                        format: uuid
                      sender_details:
                        type: object
                        properties:
                          account_number:
                            type: string
                          iban:
                            type: string
                          name:
                            type: string
                        required:
                        - account_number
                        - iban
                        - name
                        description: The account details for the customer sending the payment. Includes account number, name
                          of the account holder and IBAN.
                      recipient_details:
                        type: object
                        properties:
                          account_number:
                            type: string
                          iban:
                            type: string
                          name:
                            type: string
                        required:
                        - account_number
                        - iban
                        - name
                        description: Details for the recipient of the Payment, generated from the details available in the
                          payment_destination.
                      amount:
                        type: number
                        description: The amount the charge was initiated for.
                      currency:
                        type: string
                        description: The currency the payment was initiated with.
                      description:
                        type: string
                        description: The description submitted to the bank as a reference when initiating a payment. Can be
                          used for reconciliation. By default this value is a the Payment Intent UUID without hyphens but
                          you can also specify the description upon creation of a payment intent.
                      submission_timestamp:
                        type: string
                        description: The time the Payment Initiation was submitted.
                      initiation_timestamp:
                        type: string
                        description: The time the Payment Initiation was started.
                      status:
                        type: string
                        description: 'The current status of the payment - see Payments Errors for a list of available MFAs. '
                        enum:
                        - AUTHORISATION_FAILED
                        - FAILED
                        - PENDING_WITH_BANK
                        - ACCEPTED_BY_BANK
                      bank_transaction_reference:
                        type: string
                        description: The transaction reference number supplied by the initiating bank on successful initiation
                          of a transfer. Can be used for reconciliation.
                    required:
                    - id
                    - payment_intent_id
                    - payment_source_id
                    - sender_details
                    - recipient_details
                    - amount
                    - currency
                    - description
                    - submission_timestamp
                    - initiation_timestamp
                    - status
                    - bank_transaction_reference
                  payment_destination:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: The unique identifier for the Payment Destination object.
                      status:
                        type: string
                        enum:
                        - CONFIRMED
                        - PENDING
                        description: The status of the Destination
                      default:
                        type: string
                        description: When `true` this Destination is automatically populated into Payment Intents where an
                          alternative `payment_destination_id` is not provided.
                      name:
                        type: string
                        description: The name of the legal entity that owns the account.
                      iban:
                        type: string
                        description: 'The IBAN of the account.

                          This is required for all countries except for the US.'
                      display_name:
                        type: string
                        description: The friendly display name for the account. This is rendered in the LinkSDK when referencing
                          the Destination.
                      address:
                        type: string
                        description: The address of the owner of the destination bank account has registered with the bank.
                      city:
                        type: string
                        description: The city that the holding financial institution is located in.
                      country:
                        type: string
                        description: The three letter ISO code for the holding financial institution's country.
                      swift_code:
                        type: string
                        description: The SWIFT Code for the bank account - required for most international destinations
                      account_number:
                        type: string
                        description: The account number for the account.
                      customer_id:
                        type: string
                        description: The Customer object associated with this account. This field is optional, and will designate
                          the Destination as owned by the application if not provided.
                      owner_type:
                        type: string
                        description: Establishes the ownership of the Destination
                        enum:
                        - APPLICATION
                        - CUSTOMER
                    required:
                    - id
                    - status
                    - default
                    - name
                    - display_name
                    - address
                    - city
                    - country
                    - account_number
                required:
                - payment_intent_id
                - customer_id
                - amount
                - currency
                - description
                - payment
                - payment_destination
              example:
                payment_intent_id: 77f0c07e-7b7b-4677-bb05-6261f9eead0c
                customer_id: 89bf7bf8-89cb-42e5-8332-eeef869a2524
                amount: 61.4
                currency: AED
                description: 77f0c07e7b7b4677bb056261f9eead0c
                payment:
                  id: 25c90cc6-67dc-4193-a6e9-a7c875fcc0af
                  payment_intent_id: 77f0c07e-7b7b-4677-bb05-6261f9eead0c
                  payment_source_id: b6fba7da-1054-5e82-8a9a-afd3ab4d1710
                  sender_details:
                    account_number: XXXXXXXXXXXX
                    iban: AE940030011XXXXXXXXXXXX
                    name: John Doe
                  recipient_details:
                    account_number: XXXXXXXXXXXX
                    iban: AE870200000XXXXXXXXXXXX
                    name: Al Fulani
                  amount: 61.4
                  currency: AED
                  description: 77f0c07e7b7b4677bb056261f9eead0c
                  submission_timestamp: '2021-05-18T13:58:03.427045Z'
                  initiation_timestamp: '2021-05-18T13:58:42.445103Z'
                  status: ACCEPTED_BY_BANK
                  bank_transaction_reference: 0492981211381081
                payment_destination:
                  id: 95c29647-c568-40d7-8710-3e330de1b5f2
                  bank_identifier: HSBC_UAE
                  name: Acme Corp.
                  iban: AE870200000XXXXXXXXXXXX
                  display_name: Acme Corp.
                  account_number: XXXXXXXXXXXX
                  swift_code: BBMEAEAD
                  status: CONFIRMED
                  address: Acme Towers, 51st Floor
                  country: ARE
                  city: Dubai
                  default: 'true'
                  owner_type: APPLICATION
          headers: {}
      security:
      - bearer: []
