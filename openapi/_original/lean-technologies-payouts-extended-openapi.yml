  /payouts/v1/split-payments:
    post:
      summary: Split Payouts
      deprecated: true
      description: A split payout always divides the payout by either a fixed amount or a percentage split—depending on the
        strategy provided in the request. In case no strategy is entered in the request, the split will fallback to the preconfigured
        percentage (requires manual configuration). Additionally, any fee payment resulting from the split is directed to
        a preconfigured destination.
      operationId: splitPayout
      tags:
      - Payouts
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payment_details:
                  type: array
                  items:
                    type: object
                    properties:
                      account_id:
                        type: string
                        description: Defines the account_id to send the money from
                      destination_details:
                        type: array
                        items:
                          type: object
                          properties:
                            payment_destination_id:
                              type: string
                              description: The Destination object to initiate the payment to
                            amount:
                              type: integer
                              description: The gross amount to be transferred. The commision amount will be deducted from
                                this value
                            description:
                              type: string
                              description: Optional payment reference information.
                            authorize_payment:
                              type: boolean
                              description: When set to true the payment will be automatically authorized by the authorizer
                                credentials in Payouts (requires an authorizer account to be set up in Payouts)
                            commission:
                              type: object
                              properties:
                                strategy:
                                  type: string
                                  enum:
                                  - FIXED
                                  - PERCENTAGE
                                  default: PERCENTAGE
                                  description: Defines the commission fee calculation strategy - either a fixed value or a
                                    percentage
                                amount:
                                  type: integer
                                  description: 'The commission amount corresponding to the strategy. For instance, if the
                                    strategy is PERCENTAGE, this field represents the percentage of the payout charged as
                                    a fee.. In case of FIXED strategy the amount must be less than payout amount.

                                    '
                              required:
                              - strategy
                              - amount
                              description: Represents the commission configuration to be applied to the payout
                          required:
                          - payment_destination_id
                          - amount
                          - description
                          - authorize_payment
                          - commission
                        description: Defines the payee account for the payment
                    required:
                    - account_id
                    - destination_details
              required:
              - payment_details
            example:
              payment_details:
              - account_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                destination_details:
                - payment_destination_id: 7d9b3c2e-29f3-4b1e-bf93-8a3f2a5e3d2c
                  amount: 1500
                  description: Fixed fee strategy request
                  authorize_payment: true
                  commission:
                    strategy: FIXED
                    amount: 50
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  end_user_id:
                    type: string
                    description: Internal ID of the credentials used to queue the payment, for audit purposes.
                  payouts_payment_details:
                    type: array
                    items:
                      type: object
                      properties:
                        payment_intent_id:
                          type: string
                          description: The related Payment Intent
                        initiate_payment_task_id:
                          type: string
                          description: Informative ID for tracing a payout in Lean. Used when debugging a payout with your
                            support representative.
                        account_number:
                          type: string
                          description: Account number which is performing the payment
                        iban:
                          type: string
                          description: IBAN of the sending account
                        destination_details:
                          type: array
                          items:
                            type: object
                            properties:
                              destination_id:
                                type: string
                                description: The unique identifier for the destination
                              amount:
                                type: integer
                                description: Amount paid out after fee deduction
                              currency:
                                type: string
                                description: Currency of the transaction
                              payment_status:
                                type: string
                                description: Status of the payment
                              recipient_details:
