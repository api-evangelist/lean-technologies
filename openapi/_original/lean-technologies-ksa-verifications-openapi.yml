          type: string
        version_number:
          description: Version number of the property record
          type: string
        version_date:
          $ref: '#/components/schemas/DatePair'
        first_registration_date:
          $ref: '#/components/schemas/DatePair'
        parent_property_number:
          description: Parent Real Estate Number, present when the property has child units
          type:
          - string
          - 'null'
      required:
      - property_number
      - version_number
      - version_date
      - first_registration_date
      - parent_property_number
    PropertySellingPrice:
      description: Selling price of the property
      type:
      - object
      - 'null'
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        amount:
          description: The selling price amount
          type:
          - number
          - 'null'
      required:
      - currency
      - amount
    PropertySpatialInfo:
      type:
      - object
      - 'null'
      properties:
        area_size:
          description: Size of the property area
          type:
          - number
          - 'null'
          format: double
        property_type:
          description: 'Type of the property:

            - `VACANT_LAND`: Undeveloped land

            - `BUILDING`: A building structure

            '
          type:
          - string
          - 'null'
        property_use:
          description: 'Designated use of the property:

            - `UNAVAILABLE`

            - `RESIDENTIAL`

            - `COMMERCIAL`

            - `PUBLIC_SERVICES`

            - `PUBLIC_FACILITIES_TRANSPORTATION`

            - `INDUSTRIAL`

            - `AGRICULTURAL`

            - `ANCIENT_URBAN_REGION`

            - `VACANT_LAND`

            - `PLANS_AND_SYMBOLS`

            - `MIXED_USE`

            - `MANSION_USE`

            '
          type:
          - string
          - 'null'
        property_status:
          description: 'Physical status of the property:

            - `VACANT_LAND`: Undeveloped land

            - `BUILDING`: Complete building

            - `BUILDING_PART`: Part of a building

            '
          type:
          - string
          - 'null'
        building_availability:
          description: Whether a building exists on the property
          type:
          - boolean
          - 'null'
      required:
      - area_size
      - property_type
      - property_use
      - property_status
      - building_availability
    PropertyUnitDetails:
      description: Unit details, present when the property is a unit within a larger building
      type:
      - object
      - 'null'
      properties:
        unit_area_size:
          description: Area size of the unit
          type:
          - number
          - 'null'
          format: double
        unit_type:
          description: 'Type of unit within a building:

            - `APARTMENT`

            - `DOUBLE_FLOOR_APARTMENT`

            - `FLOOR`

            - `CONNECT_DUPLEX_VILLA`

            - `CONNECTED_VILLA`

            - `VILLA`

            - `BUILDING`

            - `SHOP`

            - `OFFICE`

            - `HOTEL`

            - `TOWER`

            '
          type:
          - string
          - 'null'
        unit_number:
          description: Unit number within the building
          type:
          - string
          - 'null'
        undivided_share_of_land:
          description: The unit's share of the common property as a decimal fraction
          type:
          - string
          - 'null'
      required:
      - unit_area_size
      - unit_type
      - unit_number
      - undivided_share_of_land
    PropertyAddress:
      type:
      - object
      - 'null'
      properties:
        city_code:
          description: City code
          type:
          - string
          - 'null'
        city_name:
          $ref: '#/components/schemas/LocalizedText'
        parcel_number:
          description: Parcel number
          type:
          - string
          - 'null'
        block_number:
          description: Block number
          type:
          - string
          - 'null'
        plan_number:
          description: Plan number
          type:
          - string
          - 'null'
        district_name:
          $ref: '#/components/schemas/LocalizedText'
        district_code:
          description: District code
          type:
          - string
          - 'null'
      required:
      - city_code
      - city_name
      - parcel_number
      - block_number
      - plan_number
      - district_name
      - district_code
    PropertyBorderInfo:
      type: object
      properties:
        direction:
          description: 'Cardinal direction of the property border:

            - `NORTH`

            - `EAST`

            - `WEST`

            - `SOUTH`

            '
          type:
          - string
          - 'null'
        type:
          description: 'Type of border:

            - `LAND`: Border with adjacent land/parcel

            - `ROAD`: Border with a road/street

            '
          type:
          - string
          - 'null'
        length:
          description: Length of the border
          type:
          - string
          - 'null'
      required:
      - direction
      - type
      - length
    PropertyOwnerInfo:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/LocalizedText'
        type:
          description: 'Type of property owner:

            - `INDIVIDUAL`

            - `ORGANIZATION`

            - `OTHER`

            '
          type: string
        identity_type:
          description: 'Type of identification document for the property owner:

            - `NATIONAL_ID`

            - `IQAMA_ID`

            - `GCC_ID`

            - `PASSPORT`

            - `PREMIUM_IQAMA`

            - `MOI_IDENTIFIER`

            - `UNIFIED_NUMBER`

            - `COMMERCIAL_NUMBER`

            - `GOVERNMENT_ENTITY_NUMBER`

            - `OTHER`

            '
          type: string
        id:
          description: Owner's identity number
          type: string
        owner_share:
          description: Ownership share as a decimal value
          type: string
        owner_share_fraction:
          description: Ownership share as a fraction
          type: string
        owning_area:
          description: Area owned by this owner
          type: string
      required:
      - name
      - type
      - identity_type
      - id
      - owner_share
      - owner_share_fraction
      - owning_area
    PropertyRrr:
      description: Right, Responsibility, or Restriction associated with the property
      type: object
      properties:
        id:
          description: Reference ID of the RRR record
          type:
          - string
          - 'null'
        number:
          description: RRR number
          type: string
        type:
          description: 'Type of Right, Responsibility, or Restriction:

            - `LIEN`

            - `LEASE`

            - `EASEMENT`

            - `USUFRUCT`

            - `RIGHT_OF_USE`

            - `RIGHT_OF_RESIDENCE`

            - `ENDOWMENT`

            - `CREDIT_PRIORITY`

            - `FIRST_REFUSAL`

            - `WILL`

            - `OWNERSHIP`

            - `OFF_PLAN`

            - `PROPERTY_SUSPENSION`

            - `LIEN_PREVENTION`

            - `LEASE_PREVENTION`

            - `SALE_PREVENTION`

            '
          type: string
        is_restriction:
          description: Whether this RRR is a restriction
          type: boolean
        status:
          description: 'Status of the RRR record:

            - `ACTIVE`

            - `INACTIVE`

            '
          type: string
      required:
      - id
      - number
      - type
      - is_restriction
      - status
    PropertySearchRequest:
      type: object
      properties:
        identification_method:
          $ref: '#/components/schemas/PropertySearchIdentificationMethod'
        identifications:
          description: Array of identifications used to search for owned properties. Must include an owner identification
            (e.g. NATIONAL_ID, IQAMA_ID, COMMERCIAL_NUMBER) and the owner's date of birth. Use DATE_OF_BIRTH_HIJRI when the
            owner identification is NATIONAL_ID, otherwise use DATE_OF_BIRTH_GREGORIAN.
          type: array
          items:
            $ref: '#/components/schemas/PropertySearchIdentificationDto'
          maxItems: 2
      required:
      - identification_method
      - identifications
    PropertySearchIdentificationMethod:
      description: 'The identification method used to search for owned properties:

        - `IDENTITY`: Search by owner identification (type + value) and date of birth

        '
      type: string
      const: IDENTITY
    PropertySearchIdentificationDto:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/PropertySearchIdentificationType'
        value:
          description: Identification value
          type: string
          minLength: 1
      required:
      - type
      - value
    PropertySearchIdentificationType:
      description: 'Type of identification used to search for owned properties:

        - `DATE_OF_BIRTH_HIJRI`: Owner''s date of birth in Hijri format YYYY-MM-DD (when the owner identification is NATIONAL_ID)

        - `DATE_OF_BIRTH_GREGORIAN`: Owner''s date of birth in Gregorian format YYYY-MM-DD (when the owner identification
        is not NATIONAL_ID)

        - `NATIONAL_ID`: Saudi National ID

        - `IQAMA_ID`: Resident ID

        - `GCC_ID`: Gulf Cooperation Council ID

        - `PASSPORT`: Passport number

        - `PREMIUM_IQAMA`: Premium resident ID

        - `MOI_IDENTIFIER`: Ministry of Interior identifier

        - `UNIFIED_NUMBER`: Business unified number

        - `COMMERCIAL_NUMBER`: Business registration number

        - `GOVERNMENT_ENTITY_NUMBER`: Government organization ID

        - `OTHER`: Other identification type

        '
      type: string
      enum:
      - DATE_OF_BIRTH_HIJRI
      - DATE_OF_BIRTH_GREGORIAN
      - NATIONAL_ID
      - IQAMA_ID
      - GCC_ID
      - PASSPORT
      - PREMIUM_IQAMA
      - MOI_IDENTIFIER
      - UNIFIED_NUMBER
      - COMMERCIAL_NUMBER
      - GOVERNMENT_ENTITY_NUMBER
      - OTHER
    PropertySearchResponse:
      allOf:
      - $ref: '#/components/schemas/Result'
      - type: object
        required:
        - verifications
        - page
        properties:
          verifications:
            description: The list of properties owned by the searched identity
            type: array
            items:
              $ref: '#/components/schemas/PropertySearchResult'
          page:
            $ref: '#/components/schemas/PageMetadata'
    PropertySearchResult:
      type: object
      properties:
        status:
          description: 'Status of the Real Estate Registry record:

            - `ACTIVE`: The property record is active

            - `INACTIVE`: The property record is inactive

            - `SUSPENDED`: The property record is suspended

            - `TEMPORARY`: The property record is temporary

            '
          type: string
        general_information:
          $ref: '#/components/schemas/PropertySearchGeneralInformation'
        spatial:
          $ref: '#/components/schemas/PropertySearchSpatialInfo'
        address:
          $ref: '#/components/schemas/PropertySearchAddress'
        owner_share_percentage:
          description: The searched owner's share of the property, as a percentage
          type: string
      required:
      - status
      - general_information
      - spatial
      - address
      - owner_share_percentage
    PropertySearchGeneralInformation:
      type: object
      properties:
        property_number:
          description: The Real Estate Number (REN)
          type: string
        first_registration_date:
          $ref: '#/components/schemas/DatePair'
        ownership_date:
          $ref: '#/components/schemas/DatePair'
      required:
      - property_number
      - first_registration_date
    PropertySearchSpatialInfo:
      type: object
      properties:
        area_size:
          description: Size of the property area
          type:
          - number
          - 'null'
          format: double
        property_use:
          description: 'Designated use of the property:

            - `UNAVAILABLE`

            - `RESIDENTIAL`

            - `COMMERCIAL`

            - `PUBLIC_SERVICES`

            - `PUBLIC_FACILITIES_TRANSPORTATION`

            - `INDUSTRIAL`

            - `AGRICULTURAL`

            - `ANCIENT_URBAN_REGION`

            - `VACANT_LAND`

            - `PLANS_AND_SYMBOLS`

            - `MIXED_USE`

            - `MANSION_USE`

            '
          type:
          - string
          - 'null'
        property_use_code:
          description: Property use code
          type:
          - integer
          - 'null'
        property_type_name:
          $ref: '#/components/schemas/LocalizedText'
        property_status:
          description: 'Physical status of the property:

            - `VACANT_LAND`: Undeveloped land

            - `BUILDING`: Complete building

            - `BUILDING_PART`: Part of a building

            '
          type:
          - string
          - 'null'
      required:
      - area_size
      - property_use
      - property_use_code
      - property_type_name
      - property_status
    PropertySearchAddress:
      type: object
      properties:
        city_name:
          $ref: '#/components/schemas/LocalizedText'
        district_name:
          $ref: '#/components/schemas/LocalizedText'
        district_code:
          description: District code
          type:
          - string
          - 'null'
      required:
      - city_name
      - district_name
      - district_code
    Currency:
      description: The ISO 3 letter currency code
      type: string
      examples:
      - AED
      pattern: ^[A-Z]{3}$
    PageMetadata:
      description: Metadata about the current page of results
      type: object
      properties:
        number:
          description: The current page being returned by the API
          type: integer
          format: int32
        size:
          description: The page size requested
          type: integer
          format: int32
        total_elements:
          description: The total number of elements in all pages
          type: integer
          format: int64
        total_pages:
          description: The total number of pages retrievable
          type: integer
          format: int32
        sort:
          description: Sort parameters applied to the results
          type: array
          items:
            type: string
      required:
      - number
      - size
      - total_elements
      - total_pages
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
