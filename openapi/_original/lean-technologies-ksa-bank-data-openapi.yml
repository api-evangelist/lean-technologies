components:
  schemas:
    Transaction:
      required:
      - account_id
      - transaction_id
      - booking_date_time
      - credit_debit_indicator
      - amount
      type: object
      properties:
        account_id:
          type: string
          description: The `account_id` this transaction is related to
        transaction_id:
          description: A unique ID for the transaction used to help you tie data back to your systems
          type: string
        transaction_information:
          description: Include the raw unparsed transaction description from the bank
          type: string
        transaction_reference:
          type: string
          description: 'A unique reference provided by the bank for the transaction.


            As an example, it may be a reference code for the local payment scheme e.g. mada, SARIE.'
        credit_debit_indicator:
          enum:
          - CREDIT
          - DEBIT
          - UNSUPPORTED
          type: string
          description: Indicates whether the transaction represents a credit (inflow) or debit (outflow) to the account.
        amount:
          $ref: '#/components/schemas/CurrencyAmount'
          description: The settled value of the transaction, denominated in the transactions's currency
        transaction_mutability:
          enum:
          - IMMUTABLE
          - MUTABLE
          - UNSUPPORTED
          type: string
          description: Specifies whether the transaction details may change after posting (e.g., pending transactions can
            update upon settlement).
        booking_date_time:
          format: date-time
          type: string
          description: Date and time when a transaction entry is posted to an account.
        insights:
          type:
          - object
          - 'null'
          properties:
            description_cleansed:
              type: string
              description: A cleaned and standardized version of the transaction description.
            category:
              enum:
              - BANK_FEES_AND_CHARGES
              - CHARITY
              - EDUCATION
              - ENTERTAINMENT
              - GOVERNMENT
              - GROCERIES
              - HEALTH_AND_WELLBEING
              - LOANS_AND_INVESTMENT
              - RENT_AND_SERVICES
              - RESTAURANTS_DINING
              - RETAIL
              - SALARY_AND_REVENUE
              - TRANSFER
              - TRANSPORT
              - TRAVEL
              - OTHER
              type: string
              description: High-level classification of the transaction
            category_confidence:
              type: number
              description: Confidence of category expressed as a percentage between 0 and 1.
          description: Value-added insights including transaction categorization, cleansed descriptions, and category confidence
            scores based on transaction enrichment.
        balance:
          $ref: '#/components/schemas/TransactionBalance'
          description: The account balance after applying the transaction, where available.
        regional_data:
          description: Region specific data response. Only provided when `verbose=true` in the originating request.
          anyOf:
          - $ref: '#/components/schemas/TransactionRegionalData'
            description: Region specific data response. Only provided when `verbose=true` in the originating request.
          - type: 'null'
    ListEntityResponse:
      title: ''
      description: ''
      type: object
      properties:
        id:
          description: The unique entity identifier
          type: string
        customer_id:
          description: The Customer object that owns the entity
          type: string
        bank_identifier:
          description: The identifier signifies which bank the user's entity is linked with.
          type: string
        permissions:
          $ref: '#/components/schemas/Permissions'
          description: Indicates which permissions have been granted by the user, this corresponds with the Data API calls
            you can make using the entity.
        bank_type:
          description: The bank type of the connected entity
          enum:
          - RETAIL
          type: string
        created_at:
          type: string
          format: date-time
          description: When the entity was created
        consents:
          description: Record of all historical consents. Note that only 1 consent can be ACTIVE at the same time
          type: array
          items:
            $ref: '#/components/schemas/EntityConsent'
        status:
          type: string
          description: Entity status
        updated_at:
          type: string
          description: When the entity was last updated
    AgentIdentifier:
      type: object
      properties:
        scheme_name:
          type: string
          description: The name of the identification scheme for the Bank
          enum:
          - BICFI
          - OTHER
          - UNSUPPORTED
          examples:
          - BICFI
        identification:
          type: string
          description: Unique and unambiguous identification of the Bank
    AttachmentSau:
      type: object
      properties:
        desc:
          type: string
        content_type:
          type: string
        content:
          type: string
        txn:
          type: string
    BeneficiaryCreditorAgent:
      required:
      - identification
      - scheme_name
      type: object
      properties:
        scheme_name:
          enum:
          - BICFI
          - OTHER
          - UNSUPPORTED
          type: string
        identification:
          type: string
        name:
          type: string
        postal_address:
          $ref: '#/components/schemas/PostalAddress'
    ChargeCurrencyAmountSau:
      required:
      - amount
      - currency
      type: object
      properties:
        amount:
          type: number
        currency:
          type: string
        charge_included:
          type: boolean
    CurrencyAmountSau:
      required:
      - amount
      - currency
      type: object
      properties:
        amount:
          type: number
        currency:
          type: string
    Frequency:
      type: object
      properties:
        frequency_type:
          enum:
          - NOT_KNOWN
          - EVERY_DAY
          - EVERY_WORKING_DAY
          - INTERVAL_DAY
          - INTERVAL_WEEK_DAY
          - WEEK_IN_MONTH_DAY
          - INTERVAL_MONTH_DAY
          - QUARTER_DAY
          - OTHER
          - UNSUPPORTED
          type: string
        interval:
          type: string
    IssuerSau:
      type: object
      properties:
        name:
          type: string
        address:
          $ref: '#/components/schemas/AddressShortSau'
        country_code:
          type: string
        jurisdiction:
          type: string
    PlaceOfBirthSau:
      type: object
      properties:
        region:
          type: string
        locality:
          type: string
        country:
          type: string
    BeneficiariesResponse:
