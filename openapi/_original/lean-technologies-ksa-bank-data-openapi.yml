                                            | SAISLD | Islamic Development Bank |

                                            | SAJPMG | J.P. Morgan Saudi Arabia Ltd. |

                                            | SACHAS | J.P. Morgan Chase Bank, N.A Riyadh |

                                            | SAMLSA | Merill Lynch Kingdom of Saudi Arabia |

                                            | SANBOB | National Bank of Bahrain |

                                            | SANBOK | National Bank of Kuwait |

                                            | SANBPA | National Bank of Pakistan |

                                            | SANCBK | Saudi National Bank |

                                            | SARIBL | Riyad Bank |

                                            | SASAMA | Saudi Arabian Monetary Authority |

                                            | SASABB | Saudi British Bank |

                                            | SASIBC | Saudi Investment Bank |

                                            | SASCBL | Standard Chartered Capital (Saudi Arabia) |

                                            | SATCZB | T.C. Ziraat Bankasi A.S. |

                                            | SASTCP | STC Pay |

                                            | SANEOL | Neoleap |'
                                          type: string
                                    account_identifiers:
                                      description: An array of identifiers for the account.
                                      type: array
                                      items:
                                        type: object
                                        properties:
                                          identification_type:
                                            description: Indicates the type of identification being provided.
                                            enum:
                                            - IBAN
                                            - MASKED_PAN
                                            - ACCOUNT_NUMBER
                                            - COMMERCIAL_REGISTRATION_NUMBER
                                            - EMAIL
                                            - MOBILE_NUMBER
                                            - NATIONAL_ID
                                            - IQAMA_NUMBER
                                            - PASSPORT_NUMBER
                                            - UNSUPPORTED
                                            type: string
                                          identification:
                                            description: Returns a value based on the `identification_type`.
                                            type: string
                                          name:
                                            type:
                                            - string
                                            - 'null'
                                            description: 'The account name is the name or names of the account owner(s) represented
                                              at an account level. Note: The account name is not the product name or the nickname
                                              of the account.'
                                    account_holder_name:
                                      type:
                                      - string
                                      - 'null'
                                      description: Name of the account holder
                                    account_holder_short_name:
                                      type:
                                      - string
                                      - 'null'
                                      description: Short form of the name of the account holder
                              description: Region specific data response. Only provided when `verbose=true` in the originating
                                request.
                              required:
