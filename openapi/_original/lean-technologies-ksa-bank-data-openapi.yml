        properties:
          beneficiaries:
            type: array
            items:
              $ref: '#/components/schemas/Beneficiary'
    Page:
      type: object
      properties:
        number:
          format: int32
          description: The page number of the current response.
          type: integer
        size:
          format: int32
          description: The number of objects in the response.
          type: integer
        total_elements:
          format: int32
          description: The total number of objects available.
          type: integer
        total_pages:
          format: int32
          description: The total number of pages to consume all of the elements.
          type: integer
    ScheduledPaymentsResponse:
      allOf:
