  /data/v2/accounts:
    get:
      summary: Get Accounts
      deprecated: false
      description: "The `Get Accounts` endpoint retrieves a list of bank accounts that have been linked by a user (or business)\
        \ via LinkSDK, identified by their entity_id. \n\nEach account object contains fields such as `account_id`, `account\
        \ status`, `currency`, `account_sub_type`, `account identifiers` (such as IBAN, ACCOUNT_NUMBER, and NATIONAL_ID) and\
        \ other data points related accounts.\n\nYou can use the resulting account_ids to query additional financial data\
        \ through other Lean APIs such as [transactions](https://docs.leantech.me/v2.0-KSA/reference/fetchtransactions#/),\
        \ [balances](https://docs.leantech.me/v2.0-KSA/reference/fetchbalances#/), [beneficiaries](https://docs.leantech.me/v2.0-KSA/reference/fetchbeneficiaries#/),\
        \ and other data APIs."
      operationId: fetchAccounts
      tags:
      - Raw Data
      parameters:
      - name: entity_id
        in: query
        description: The `entity_id` you're querying for.
        required: true
        example: a2fca65a-8c9a-4623-a84b-b0b08403669d
        schema:
          type: string
          format: uuid
      - name: async
        in: query
        description: When `true` the API will only return a `results_id` which can be fetched from the `/results` endpoint
          when ready.
        required: false
        example: 'false'
        schema:
          default: false
          type: boolean
      - name: page
        in: query
        description: The page you're requesting - returns page 0 of a response if not specified.
        required: false
        example: 0
        schema:
          type: integer
          format: int32
          maximum: 100
      - name: size
        in: query
        description: The number of objects you want to return as a page size.
        required: false
        example: 50
        schema:
          type: integer
          format: int32
          maximum: 100
      - name: force_refresh
        in: query
        description: 'Ignore Lean''s caching and force a call to the bank. This may have unwanted performance issues. '
        required: false
        example: 'false'
        schema:
          default: false
          type: boolean
      - name: verbose
        in: query
        description: Shows `regional_data` values in responses when true. Defaults to `false`.
        required: false
        example: 'false'
        schema:
          default: false
          type: boolean
      - name: meta
        in: query
        description: 'Additional data you would like to store against the request. Example: {"foo": "val"}'
        required: false
        example: ''
        schema:
          type: string
      - name: lean-app-token
        in: header
        description: 'How Lean identifies your application. '
        required: true
        example: ''
        schema:
          type: string
          format: uuid
      - name: content-type
        in: header
        description: Language preference (e.g., ar for Arabic)
        required: false
        example: ''
        schema:
          type: string
          examples:
          - application/json
      - name: lean-correlation-id
        in: header
        description: Optional ID to trace requests for debugging
        required: false
        example: ''
        schema:
          type: string
      - name: accept-language
        in: header
        description: The reposnse by defalut will be in json format unless mentioned
        required: false
        example: ''
        schema:
          type: string
      - name: customer-ip
        in: header
        description: IP Address of the customer. Required to indicate that the user is currently on-session. When this value
          isn't supplied the request is treated as a background refresh. Banks may place limits on the number of background
          refreshes can be performed over 24 hours.
        required: false
        example: ''
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    description: The status of the results. For async requests, initially returns PENDING.
                    enum:
                    - OK
                    - FAILED
                    - PENDING
                    - CONSENT_EXPIRED
                    type: string
                  results_id:
                    type: string
                    description: The ID for this result, this is used when retrieving results from the `/results` endpoint.
                    format: uuid
                  message:
                    description: A message describing the status of the request.
                    type: string
                  meta:
                    type:
                    - string
                    - 'null'
                    description: Optional metadata associated with the result.
                  timestamp:
                    format: date-time
                    description: The timestamp with timezone offset indicating when the response was generated.
                    type: string
                  status_detail:
                    description: Further detail on the error if status=FAILED
                    type: object
                    properties:
                      granular_status_code:
                        description: Detailed error code
                        type: string
                      status_additional_info:
                        description: Further detail on the encountered error
                        type: string
                  data:
                    type: object
                    properties:
                      accounts:
                        type: array
                        items:
                          type: object
                          properties:
                            account_id:
                              description: The unique identifier for the account. Provided as a UUID.
                              type: string
                            status:
                              description: The current status of the account. Indicating whether it is in active use or not.
                              enum:
                              - DELETED
                              - DISABLED
                              - ENABLED
                              - PENDING
                              - PROFORMA
                              - UNSUPPORTED
                              type: string
                            status_update_date_time:
                              type:
                              - string
                              - 'null'
                              description: The datetime that the status was last updated.
                              format: date-time
                            currency:
                              description: The ISO 3 letter currency code that the account stores value in.
                              type: string
                            account_type:
                              description: 'Indicates whether the account is a retail consumer account or a business account. '
                              enum:
                              - PERSONAL
                              - BUSINESS
                              - UNSUPPORTED
                              type: string
                            account_sub_type:
                              type: string
                              description: Indicates the type of account.
                              enum:
                              - CURRENT
                              - CREDIT
                              - SAVINGS
                              - CHARGE_CARD
                              - EMONEY
                              - LOAN
                              - MORTGAGE
                              - PREPAID
                              - CALL
                              - UNSUPPORTED
                            nickname:
                              type:
                              - string
                              - 'null'
                              description: The name for this account as set by the owner of the account. This name is known
                                to the user.
                            description:
                              type:
                              - string
                              - 'null'
                              description: Specifies the description of the account sub-type.
                            opening_date:
                              type:
                              - string
                              - 'null'
                              description: The date and time the account was opened.
                              format: date-time
                              examples:
                              - 2013-03-15 22:00:00.000 +0400
                            maturity_date:
                              type:
                              - string
                              - 'null'
                              description: Maturity date of the account.
                              format: date-time
                            account:
                              type: array
                              items:
                                type: object
                                properties:
                                  scheme_name:
                                    type: string
                                    description: Name of the identification scheme for the account.
                                    enum:
                                    - IBAN
                                    - BBAN
                                    - PAN
                                    - OTHER
                                    - UNSUPPORTED
                                  identification:
                                    type: string
                                    description: Identification value for the account assigned by the bank based on the Account
                                      Scheme Name
                                  name:
                                    type:
                                    - string
                                    - 'null'
                                    description: The name of the account owner(s) represented at an account level
                              description: Identification for the account assigned by the Bank based on the Account Scheme
                                Name
                            servicer:
                              description: Party that manages the account on behalf of the account owner, that is manages
                                the registration and booking of entries on the account, calculates balances on the account
                                and provides information about the account.
                              type: object
                              properties:
                                scheme_name:
                                  type: string
                                  description: The name of the identification scheme for the Bank
                                  enum:
                                  - BICFI
                                  - OTHER
                                  - UNSUPPORTED
                                  examples:
                                  - BICFI
                                identification:
                                  type: string
                                  description: Unique and unambiguous identification of the Bank
                            regional_data:
                              type: object
                              properties:
                                data:
                                  type: object
                                  properties:
                                    account_id:
                                      format: uuid
                                      description: The unique identifier for the account. Provided as a UUID.
                                      type: string
                                    status:
                                      description: The current status of the account indicating whether it is in active use
                                        or in some other state.
                                      enum:
                                      - ACTIVE
                                      - NOT_ACTIVE
                                      - DORMANT
                                      - UNCLAIMED
                                      - DECEASED
                                      - SUSPENDED
                                      - CLOSED
                                      - UNSUPPORTED
                                      type: string
                                    status_update_date_time:
                                      type:
                                      - string
                                      - 'null'
                                      description: The datetime that the status was last updated.
                                      format: date-time
                                    currency:
                                      description: The 3 Letter ISO code denominating the currency that the account stores
                                        value in.
                                      type: string
                                    account_type:
                                      description: Indicates whether the account is a retail consumer account or a corporate
                                        account.
                                      enum:
                                      - RETAIL
                                      - CORPORATE
                                      - UNSUPPORTED
                                      type: string
                                    account_sub_type:
                                      description: Indicates the type of account.
                                      enum:
                                      - CHARGE_CARD
                                      - CREDIT_CARD
                                      - CURRENT_ACCOUNT
                                      - E_MONEY
                                      - PRE_PAID_CARD
                                      - SAVINGS
                                      - OTHER
                                      - UNSUPPORTED
                                      type: string
                                    description:
                                      type:
                                      - string
                                      - 'null'
                                      description: Specifies the description of the account sub-type.
                                    nickname:
                                      type:
                                      - string
                                      - 'null'
                                      description: The nickname of the account, assigned by the owner of the account to provide
                                        an additional and easier means of identification of the account.
                                    opening_date:
                                      type:
                                      - string
                                      - 'null'
                                      description: The datetime that the account was opened.
                                      format: date-time
                                    maturity_date:
                                      type:
                                      - string
                                      - 'null'
                                      description: Maturity date of the account.
                                      format: date-time
                                    servicer:
                                      description: Details on the organization that manages the account on behalf of the account
                                        owner.
                                      type: object
                                      properties:
                                        identification_type:
                                          description: 'The type of identifier being provided.


                                            | Value | Description |

                                            |-|-|

                                            | BICFI | The BIC/SWIFT code for the Financial Institution |

                                            | OTHER | A combination of country code and 4 letter identifier for a financial
                                            institution |'
                                          enum:
                                          - BICFI
                                          - OTHER
                                          - UNSUPPORTED
                                          type: string
                                        identification:
                                          description: 'Provides either the BIC/SWIFT code for the Financial Institution or
                                            a value from a coded list.


                                            | Identifier | Institution |

                                            |-|-|

                                            | SAINMA | Alinma Bank |

                                            | SARJHI | Al Rajhi Bank |

                                            | SAARNB | Arab National Bank |

                                            | SAALBI | Bank Al Bilad |

                                            | SABJAZ | Bank Al-Jazira |

                                            | SABMUS | Bank Muscat |

                                            | SABSFR | Banque Saudi Fransi |

                                            | SABNPA | BNP Paribas Saudi Arabia |

