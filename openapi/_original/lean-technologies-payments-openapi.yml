          type: string
          enum:
          - WEB_BROWSER
          - MOBILE_APP
          - SMART_TV
          - WEARABLE_DEVICE
          - POS_TERMINAL
          - ATM
          - KIOSK_TERMINAL
          - OTHER
        merchant_risk:
          $ref: '#/components/schemas/MerchantRisk'
        supplementary_data:
          type: object
          description: Additional information that cannot be captured in the structured fields and/or any other specific block.
    Payments20InitiateAccountOnFilePaymentResponse:
      type: object
      required:
      - id
      - account_id
      - application_id
      - consent_id
      - status
      - amount
      - sender_customer_id
      - created_at
      - last_modified_at
      - type
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier for the payment.
        account_id:
          type: string
          format: uuid
          description: The account id that the payment is being made to.
        application_id:
          type: string
          format: uuid
          description: The application id that the payment is being made to.
        consent_id:
          type: string
          format: uuid
          description: The consent id that the payment is being made under.
        status:
          type: string
          description: "Reflects the latest known state of processing in Lean’s systems and bank.\n\n**Possible values:**\n\
            \n- **`CREATED`** —  \n  An internal transaction record has been created, but **no interaction with the bank has\
            \ occurred yet**.  \n  This includes any validation steps required before initiation.  \n  Detailed progress within\
            \ the approval flow may be represented through *sub-statuses*.\n\n- **`PROCESSING`** —  \n  The transaction has\
            \ been **submitted or is being attempted at the bank**.  \n  Multiple initiation attempts may occur under this\
            \ state.  \n  More granular progress can be indicated by *sub-statuses*.\n\n- **`PROCESSED`** —  \n  The **final\
            \ successful** state.  \n  The payment has been confirmed as completed by the payment status tracking process.\n\
            \  Sub-statuses or other technology-specific codes may appear to indicate settlement details.\n\n- **`FAILED`**\
            \ —  \n  The **final unsuccessful** state.  \n  Failure may occur:\n    - before any bank initiation (e.g. validation\
            \ issues),\n    - after repeated unsuccessful initiation attempts (e.g. bank unavailable, other technical issues),\
            \ or\n    - even after an initially successful initiation followed by a **reversal detected by payment status\
            \ tracking** before final reporting.\n---\n**Notes:**\n- `CREATED` and `PROCESSING` are transitional states. \
            \ \n- `PROCESSED` and `FAILED` are terminal states.  \n- Sub-statuses provide additional context.\n"
          enum:
          - CREATED
          - PROCESSING
          - PROCESSED
          - FAILED
        sub_status:
          type: string
          description: 'Provides additional detail about the current lifecycle stage of the payment.

            It can represent intermediate workflow steps, bank-specific responses or system conditions that further qualify
            the main status.'
        reference:
          type: string
          description: A reason or reference in relation to a payment. Passed as a part of OF `creditor_reference`. This value
            will be used as default reference for payments made with this consent.
        amount:
          $ref: '#/components/schemas/CurrencyAmount'
        type:
          type: string
          enum:
          - ACCOUNT_ON_FILE
        sender_customer_id:
          type: string
          format: uuid
          description: The customer id of the sender.
        created_at:
          type: string
          format: date-time
          description: The date and time when the payment was created.
        last_modified_at:
          type: string
          format: date-time
          description: The date and time when the payment was last modified.
        failure_details:
          type: object
          properties:
            code:
              type: string
              description: The error code.
            details:
              type: string
              description: The error details.
