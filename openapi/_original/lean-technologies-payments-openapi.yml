  /consents/account-on-file:
    post:
      summary: Create a new non-authorized AoF consent
      description: This operation will result in creation of non-authorized consent of Account-On-File type.
      operationId: createAccountOnFileConsent
      tags:
      - Account On File
      security:
      - OAuth2:
        - api
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - customer_id
              - destination_account_id
              - currency
              - reference
              - purpose
              - control_parameters
              properties:
                customer_id:
                  type: string
                  format: uuid
                  description: The unique identifier of the customer for whom the consent is being created.
                  example: acc176ca-7716-4fbb-a735-d0e3dec24b40
                destination_account_id:
                  type: string
                  format: uuid
                  description: The unique identifier of the account acting as a consent beneficiary.
                  example: 911f30d8-8fc8-4fe9-86a1-3f9fea11a674
                currency:
                  $ref: '#/components/schemas/Currency'
                reference:
                  $ref: '#/components/schemas/Reference'
                purpose:
                  $ref: '#/components/schemas/PaymentPurposeCode'
                control_parameters:
                  $ref: '#/components/schemas/AccountOnFileControlParameters'
                government_identifier:
                  description: "Unique government identifier of the customer making the payment.  \nAs required by the UAE\
                    \ Open Finance standard, it ensures the debtor can be uniquely recognized.\nThis field supports providing\
                    \ or updating the identifier on-the-fly when creating a consent."
                  allOf:
                  - $ref: '#/components/schemas/GovernmentIdentifierRequest'
                start_date_time:
                  type: string
                  format: date-time
                  nullable: true
                  example: '2025-07-11T16:58:03.559872Z'
                  description: "The date and time when the consent becomes active.  \n**Optional.** Defaults to the current\
                    \ date and time if not provided.\n"
                expiration_date_time:
                  type: string
                  format: date-time
                  nullable: true
                  example: '2026-07-11T16:58:03.559872Z'
                  description: "The date and time when the consent expires.  \n**Optional.** Defaults to one year after `start_date_time`\
                    \ if not provided.\n"
            examples:
              minimal:
                summary: Minimal Request
                description: The minimum required fields to create a new Account On File consent.
                value:
                  customer_id: acc176ca-7716-4fbb-a735-d0e3dec24b40
                  destination_account_id: 911f30d8-8fc8-4fe9-86a1-3f9fea11a674
                  currency: AED
                  reference: ACME-ACCOUNT-LINK-2025-001
                  purpose: GDS
                  control_parameters:
                    period_type: Day
                    max_individual_amount: '1000.00'
              complete:
                summary: Complete Request
                description: The complete set of fields to create a new Account On File consent.
                value:
                  customer_id: acc176ca-7716-4fbb-a735-d0e3dec24b40
                  destination_account_id: 911f30d8-8fc8-4fe9-86a1-3f9fea11a674
                  currency: AED
                  reference: ACME-ACCOUNT-LINK-2025-001
                  purpose: GDS
                  control_parameters:
                    period_type: Day
                    max_individual_amount: '1000.00'
                    max_cumulative_amount: '10000.00'
                    max_cumulative_number_of_payments: 100
                    max_cumulative_amount_per_period: '3000.00'
                    max_cumulative_number_of_payments_per_period: 10
                  government_identifier:
                    type: EMIRATES_ID
                    value: 784-1234-1234-1234
                  start_date_time: '2025-12-01T12:00:00.559872Z'
                  expiration_date_time: '2026-12-10T16:00:00.559872Z'
        description: Request to create a new Account on File consent
        required: true
      responses:
        '200':
          description: Consent created successfully
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - application_id
                - start_date_time
                - expiration_date_time
                - customer_id
                - status
                - destination_account_id
                - reference
                - currency
                - payment_purpose
                - control_parameters
                properties:
                  id:
                    type: string
                    format: uuid
                    description: The unique identifier for the consent. Provided as a UUID.
                  application_id:
                    type: string
                    description: Application identifier owning this consent
                  start_date_time:
                    type: string
                    format: date-time
                    description: Date and time from when the consent will be active
                  expiration_date_time:
                    type: string
                    format: date-time
                    description: Date and time of the expiration of this consent
                  customer_id:
                    type: string
                    format: uuid
                    description: Id of a customer that this consent belongs to
                  status:
                    type: string
                    enum:
                    - AWAITING_AUTHORISATION
                    - AUTHORISED
                    - REVOKED
                    - REJECTED
                    - EXPIRED
                    - CONSUMED
                    - SUSPENDED
                    description: Current status of this consent.
                  destination_account_id:
                    type: string
                    format: uuid
                    description: Account id that this consent allows payments to
                  reference:
                    type: string
                    description: A reason or reference in relation to a payment. Passed as a part of OF `creditor_reference`.
                      This value will be used as default reference for payments made with this consent.
                  currency:
                    $ref: '#/components/schemas/Currency'
                  purpose:
                    $ref: '#/components/schemas/PaymentPurposeCode'
                  control_parameters:
                    $ref: '#/components/schemas/AccountOnFileControlParameters'
              examples:
                minimal:
                  summary: Minimal Response
                  value:
                    id: 123e4567-e89b-12d3-a456-426655440000
                    status: AWAITING_AUTHORISATION
                    customer_id: acc176ca-7716-4fbb-a735-d0e3dec24b40
                    destination_account_id: 911f30d8-8fc8-4fe9-86a1-3f9fea11a674
                    currency: AED
                    reference: ACME-ACCOUNT-LINK-2025-001
                    purpose: GDS
                    control_parameters:
                      period_type: Day
                      max_individual_amount: '1000.00'
                complete:
                  summary: Complete Response
                  value:
                    id: 123e4567-e89b-12d3-a456-426655440000
                    status: AWAITING_AUTHORISATION
                    customer_id: acc176ca-7716-4fbb-a735-d0e3dec24b40
                    destination_account_id: 911f30d8-8fc8-4fe9-86a1-3f9fea11a674
                    currency: AED
                    reference: ACME-ACCOUNT-LINK-2025-001
                    purpose: GDS
                    start_date_time: '2025-07-11T16:58:03.559872Z'
                    expiration_date_time: '2026-07-11T16:58:03.559872Z'
                    control_parameters:
                      period_type: Day
                      max_individual_amount: '1000.00'
                      max_cumulative_amount: '10000.00'
                      max_cumulative_number_of_payments: 100
                      max_cumulative_amount_per_period: '3000.00'
                      max_cumulative_number_of_payments_per_period: 10
  /payments/account-on-file:
    post:
      summary: Initiate a AoF payment
      description: Endpoint responsible for initiating a AoF payment against an existing, authorized consent
      tags:
      - Account On File
      security:
      - OAuth2:
        - api
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: 'Unique key used to ensure idempotency of requests.

          Must be unique per operation.

          '
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              description: Request to initiate a new account on file payment
              type: object
              required:
              - consent_id
              - amount
              - risk_details
              properties:
                consent_id:
                  type: string
                  format: uuid
                  description: An id of an authorized consent that should be used to authorize this payment
                amount:
                  type: number
                  format: double
                  description: The amount to be paid.
                purpose:
                  $ref: '#/components/schemas/PaymentPurposeCode'
                risk_details:
                  allOf:
                  - $ref: '#/components/schemas/RiskDetails'
                reference:
                  type: string
                  nullable: true
                  description: The reference submitted to the bank as a reference when initiating a payment. Can be used for
                    reconciliation.
              example:
                consent_id: 123e4567-e89b-12d3-a456-426655440000
                amount: 130.52
                purpose: GDS
                reference: INV-2025-004321
                risk_details:
                  transaction_indicators:
                    channel: WEB
                  debtor_indicators:
                    geo_location:
                      latitude: 25.2048
                      longitude: 55.2708
      responses:
        '200':
          description: "Indicates that request was processed and payment initiation request was sent to the bank. \nThis does\
            \ not mean that the payment was successful!"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payments20InitiateAccountOnFilePaymentResponse'
              examples:
                minimal:
                  summary: Minimal Response
                  value:
                    id: 341c3308-408d-48d9-ae44-c98eb1aa9a6f
                    account_id: 911f30d8-8fc8-4fe9-86a1-3f9fea11a674
                    application_id: 21ecf613-adaa-4c6b-8cd5-827de43bbe52
                    consent_id: 123e4567-e89b-12d3-a456-426655440000
                    status: CREATED
                    reference: ACME-ACCOUNT-LINK-2025-001
                    amount:
                      currency: AED
                      value: 130.52
                    type: ACCOUNT_ON_FILE
                    sender_customer_id: acc176ca-7716-4fbb-a735-d0e3dec24b40
                complete:
                  summary: Complete Response
                  value:
                    id: 341c3308-408d-48d9-ae44-c98eb1aa9a6f
                    account_id: 911f30d8-8fc8-4fe9-86a1-3f9fea11a674
                    application_id: 21ecf613-adaa-4c6b-8cd5-827de43bbe52
                    consent_id: 123e4567-e89b-12d3-a456-426655440000
                    status: FAILED
                    reference: ACME-ACCOUNT-LINK-2025-001
                    amount:
                      currency: AED
                      value: 130.52
                    type: ACCOUNT_ON_FILE
                    sender_customer_id: acc176ca-7716-4fbb-a735-d0e3dec24b40
                    failure_details:
                      code: BANK_ISSUE
                      details: The banks is having a technical issues. Please try again later.
components:
  schemas:
    PaymentDestination:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier for the Payment Destination object.
        status:
          type: string
          enum:
          - CONFIRMED
          - PENDING
          description: The status of the Destination
        default:
          type: string
          description: When `true` this Destination is automatically populated into Payment Intents where an alternative `payment_destination_id`
            is not provided.
        branch_address:
          type: string
          description: The address of the branch that holds the account - required for all beneficiaries outside of ARE. This
            should be a single string with commas separating lines.
        name:
          type: string
          description: The name of the legal entity that owns the account.
        iban:
          type: string
          description: 'The IBAN of the account.

            This is required for all countries except for the US.'
        display_name:
          type: string
          description: The friendly display name for the account. This is rendered in the LinkSDK when referencing the Destination.
        address:
          type: string
          description: The address of the owner of the destination bank account has registered with the bank.
        city:
          type: string
          description: The city that the holding financial institution is located in.
        country:
          type: string
          description: The three letter ISO code for the holding financial institution's country.
        swift_code:
          type: string
          description: The SWIFT Code for the bank account - required for most international destinations
        account_number:
          type: string
          description: The account number for the account.
        customer_id:
          type: string
          description: The Customer object associated with this account. This field is optional, and will designate the Destination
            as owned by the application if not provided.
        ifsc:
          type: string
          description: The IFSC number for the bank account - required for international destinations in India.
        transit_number:
          type: string
          description: The Transit Number for the bank account - required for international destinations in Canada
        sort_code:
          type: string
          description: The Sort Code for the bank account - required for international destinations in the UK
        routing_number:
          type: string
          description: The Routing Number for the bank account - required for international destinations in the US.
        postal_code:
          type: string
          description: The Postal Code of the owner of the destination bank account has registered with the bank - required
            for international destinations in the UK or the US
        currency:
          type: string
          description: The currency of the destination bank account - required for international destinations in the UK or
            the US
      required:
      - id
      - status
      - default
      - name
      - display_name
      - address
      - city
      - country
      - account_number
    Pagination:
      type: object
      properties:
        number:
          type: integer
          description: The current page being returned by the API
        size:
          type: integer
          description: The page size requested
        total_elements:
          type: integer
          description: The total number of elements in all pages
        total_pages:
          type: integer
          description: The total number of pages retrievable
      required:
      - number
      - size
      - total_elements
      - total_pages
    PaymentSource:
      type: object
      properties:
        id:
          type: string
          description: The id of the Payment Source
          format: uuid
        customer_id:
          type: string
          description: The unique identifier for the Customer that owns the Payment Source
          format: uuid
        app_id:
          type: string
          description: The application associated with the Payment Source
        status:
          type: string
          description: The current status of the beneficiary. Indicates whether the Payment Destination and Payment Source
            channel is chargeable.
          deprecated: true
          enum:
          - AWAITING_BENEFICIARY_COOL_OFF
          - ACTIVE
        beneficiary_cool_off_expiry:
          type: string
          deprecated: true
          format: date-time
          description: The time that the beneficiary cool down period will, or did, expire. After this time the beneficiary
            will be chargeable.
        bank_identifier:
          type: string
          description: Identifier that specifies the financial institution that holds the accounts
        beneficiaries:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: A unique identifier for the beneficiary
              payment_destination_id:
                type: string
                format: uuid
                description: The identifier for the associated Payment Destination resource
              status:
                type: string
                description: The current status of the beneficiary
                enum:
                - AWAITING_BENEFICIARY_COOL_OFF
                - ACTIVE
              beneficiary_cool_off_expiry:
                type: string
                description: The time that the beneficiary cool down period will, or did, expire. After this time the beneficiary
                  will be chargeable.
                format: date-time
            required:
            - id
            - payment_destination_id
            - status
          description: 'An array of beneficiaries that have been added to the Payment Source.

            A beneficiary is the representation of the connection between a Payment Source and a Payment Destination.

            The beneficiary object belongs to the payment source object and is linked to a Payment Destination object.

            A payment can only be initiated from a payment source to a Destination which is linked to one of the Payment Source''s
            beneficiaries.'
        accounts:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: The unique identifier for the account.
              account_id:
                type: string
                description: A secondary identifier for the account.
                deprecated: true
              account_name:
                type: string
                description: The friendly name for the account - for example "Gold Savings Account".
              account_number:
                type: string
                description: The bank account number for the account.
              iban:
                type: string
                description: The IBAN number for the account.
              balance:
                type: number
                deprecated: true
                format: double
                description: The balance available on the account at the last payment.
              currency:
                type: string
                description: The currency that the account supports.
              balance_last_updated:
                type: string
                description: The last date the balance was refreshed.
                deprecated: true
            required:
            - id
            - account_id
            - account_name
            - account_number
            - iban
            - balance
            - currency
            - balance_last_updated
      required:
      - id
      - customer_id
      - app_id
      - status
      - beneficiary_cool_off_expiry
      - beneficiaries
      - bank_identifier
    Payment:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for this payment.
          format: uuid
        payment_intent_id:
          type: string
          description: The Payment Intent identifier responsible for generating the Payment.
          format: uuid
        payment_source_id:
          type: string
          description: The identifier for the payment source object from which the payment was initiatied.
          format: uuid
        sender_details:
          type: object
          properties:
            account_number:
              type: string
            iban:
              type: string
            name:
              type: string
          required:
          - account_number
          - iban
          - name
          description: The account details for the customer sending the payment. Includes account number, name of the account
            holder and IBAN.
        recipient_details:
          type: object
          properties:
            account_number:
              type: string
            iban:
              type: string
            name:
              type: string
          required:
          - account_number
          - iban
          - name
          description: Details for the recipient of the Payment, generated from the details available in the payment_destination.
        amount:
          type: number
          description: The amount the charge was initiated for.
        currency:
          type: string
          description: The currency the payment was initiated with.
        description:
          type: string
          description: The description submitted to the bank as a reference when initiating a payment. Can be used for reconciliation.
            By default this value is a the Payment Intent UUID without hyphens but you can also specify the description upon
            creation of a payment intent.
        submission_timestamp:
          type: string
          description: The time the Payment Initiation was submitted.
        initiation_timestamp:
          type: string
          description: The time the Payment Initiation was started.
        status:
          type: string
          enum:
          - AWAITING_LOGIN_MFA
          - AWAITING_PAYMENT_MFA
          - AWAITING_APP_AUTH
          - FAILED
          - PENDING_WITH_BANK
          - ACCEPTED_BY_BANK
          description: 'The current status of the payment - see Payments Errors for a list of available MFAs. '
        bank_transaction_reference:
          type: string
          description: The transaction reference number supplied by the initiating bank on successful initiation of a transfer.
            Can be used for reconciliation.
      required:
      - id
      - payment_intent_id
      - payment_source_id
      - sender_details
      - recipient_details
      - amount
      - currency
      - description
      - submission_timestamp
      - initiation_timestamp
      - status
      - bank_transaction_reference
    PaymentIntent:
      type: object
      properties:
        payment_intent_id:
          type: string
          format: uuid
          description: The unique identifier for the Payment Intent.
        customer_id:
          type: string
          description: The Customer object associated with the Payment Intent.
        amount:
          type: number
          description: The amount that should be charged to the customer.
          format: float
        currency:
          type: string
          minLength: 3
          maxLength: 3
          examples:
          - AED
          - USD
          description: The currency that the customer will make the payment in.
        description:
          type: string
          description: The description submitted to the bank as a reference when initiating a payment. Can be used for reconciliation.
            By default this value is a the Payment Intent UUID without hyphens but you can also specify the description upon
            creation of a payment intent.
        payments:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
          description: An array of Payment Initiation(s) - currently there will only ever be one Payment object within the
            array once a user has started to complete a payment.
        payment_destination:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: The unique identifier for the Payment Destination object.
            status:
              type: string
              enum:
              - CONFIRMED
              - PENDING
              description: The status of the Destination
            default:
              type: string
              description: When `true` this Destination is automatically populated into Payment Intents where an alternative
                `payment_destination_id` is not provided.
            name:
              type: string
              description: The name of the legal entity that owns the account.
            iban:
              type: string
              description: 'The IBAN of the account.

                This is required for all countries except for the US.'
            display_name:
              type: string
              description: The friendly display name for the account. This is rendered in the LinkSDK when referencing the
                Destination.
            address:
              type: string
              description: The address of the owner of the destination bank account has registered with the bank.
            city:
              type: string
              description: The city that the holding financial institution is located in.
            country:
              type: string
              description: The three letter ISO code for the holding financial institution's country.
            swift_code:
              type: string
              description: The SWIFT Code for the bank account - required for most international destinations
            account_number:
              type: string
              description: The account number for the account.
            customer_id:
              type: string
              description: The Customer object associated with this account. This field is optional, and will designate the
                Destination as owned by the application if not provided.
            owner_type:
              type: string
              description: Establishes the ownership of the Destination
              enum:
              - APPLICATION
              - CUSTOMER
          required:
          - id
          - status
          - default
          - name
          - display_name
          - address
          - city
          - country
          - account_number
      required:
      - payment_intent_id
      - customer_id
      - amount
      - currency
      - description
      - payments
      - payment_destination
    GovernmentIdentifierRequest:
      type: object
      required:
      - type
      - value
      properties:
        value:
          type: string
          description: The identifier value
          minLength: 1
          pattern: ^(?!\s*$).+
        type:
          type: string
          description: The type of Government ID
          enum:
          - EMIRATES_ID
          - TRADE_LICENSE_NUMBER
    Currency:
      type: string
      pattern: ^[A-Z]{3}$
      description: The ISO 3 letter currency code.
      example: AED
    CurrencyAmount:
      type: object
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        amount:
          type: number
      required:
      - currency
      - amount
    PaymentPurpose:
      type: object
      title: PaymentPurpose
      description: Indicates the reason for the payment using a standardized code and human-readable description.
      required:
      - code
      - description
      properties:
        code:
          $ref: '#/components/schemas/PaymentPurposeCode'
        description:
          type: string
          description: A human-readable description of payment purpose
    PaymentPurposeCode:
      type: string
      title: PaymentPurposeCode
      description: "A category code that relates to the type of services or goods that corresponds to the underlying purpose\
        \ of the payment.  \nThe code must conform to the payment purpose code list.  \n**Supported values:**  \n- `FIS` –\
        \ Financial services\n- `TCS` – Telecommunication services\n- `MWP` – Mobile wallet card payments\n- `OAT` – Own account\
        \ transfer\n- `IFS` – Information services\n- `RNT` – Rent payments\n- `LNC` – Loan charges\n- `PIN` – Personal investments\n\
        - `GDS` – Goods bought or sold"
      enum:
      - FIS
      - TCS
      - MWP
      - OAT
      - IFS
      - RNT
      - LNC
      - PIN
      - GDS
    PeriodType:
      type: string
      title: PeriodType
      description: "Defines the time period used for applying limits on a long‑lived consent. \nThis value determines how\
        \ consumption limits (e.g., maximum amounts or number of payments) are calculated within each period.\n\n**Supported\
        \ values:**\n- `Day` – A single calendar day (00:00 to 23:59).\n- `Week` – Seven consecutive days.\n- `Month` – A\
        \ full calendar month (from the 1st to the last day).\n- `Year` – A full calendar year (12 consecutive months)."
      enum:
      - Day
      - Week
      - Month
      - Year
    Reference:
      title: Reference
      description: A reason or reference in relation to a payment. Maximum 64 chars
      type: string
      maxLength: 64
      example: 'Invoice #12345'
    AccountOnFileControlParameters:
      title: AccountOnFileControlParameters
      description: "Defines the control parameters for a Account On File (AoF) consent.  \nThese parameters specify the applicable\
        \ limits for individual payments, cumulative amounts, and the number of payments allowed within a defined period or\
        \ across the consent's lifetime.\nAt least one of `max_individual_amount`, `max_cumulative_amount`, or `max_cumulative_number_of_payments`\
        \ must be provided."
      type: object
      required:
      - period_type
      properties:
        period_type:
          $ref: '#/components/schemas/PeriodType'
        max_individual_amount:
          type: number
          description: Maximum amount allowed for a single payment
          minimum: 0.01
        max_cumulative_amount:
          type: number
          description: Maximum cumulative amount allowed across all payments
          minimum: 0.01
        max_cumulative_number_of_payments:
          type: integer
          description: Maximum number of payments allowed in total
          minimum: 1
        max_cumulative_amount_per_period:
          type: number
          description: Maximum cumulative amount allowed per period
          minimum: 0.01
        max_cumulative_number_of_payments_per_period:
          type: integer
          description: Maximum number of payments allowed per period
          minimum: 1
    RiskDetails:
      title: RiskDetails
      type: object
      description: The Risk section is used to specify additional details for risk/fraud scoring regarding Payments
      properties:
        debtor_indicators:
          $ref: '#/components/schemas/DebtorIndicators'
        destination_delivery_address:
          $ref: '#/components/schemas/DestinationDeliveryAddress'
        transaction_indicators:
          $ref: '#/components/schemas/TransactionIndicators'
    DebtorIndicators:
      title: DebtorIndicators
      type: object
      description: Debtor (User) Indicators
      properties:
        authentication:
          $ref: '#/components/schemas/Authentication'
        user_name:
          $ref: '#/components/schemas/Name'
        geo_location:
          $ref: '#/components/schemas/GeoLocation'
        device_information:
          $ref: '#/components/schemas/DeviceInformation'
        biometric_capabilities:
          $ref: '#/components/schemas/BiometricCapabilities'
        app_information:
          $ref: '#/components/schemas/AppInformation'
        browser_information:
          $ref: '#/components/schemas/BrowserInformation'
        user_behavior:
          $ref: '#/components/schemas/UserBehavior'
        account_risk_indicators:
          $ref: '#/components/schemas/AccountRiskIndicators'
        supplementary_data:
          type: object
          description: Additional information that cannot be captured in the structured fields and/or any other specific block.
            This may include information that is not available in the structured fields, such as a user's behavioural data
            like their typing speed and typing patterns.
    Name:
      type: object
      properties:
        en:
          type: string
        ar:
          type: string
    ChannelType:
      type: string
      description: Where the payment has been initiated from
      enum:
      - WEB
      - MOBILE
    DeliveryTimeframe:
      type: string
      title: DeliveryTimeframe
      description: Timeframe for the delivery of purchased items
      enum:
      - ELECTRONIC_DELIVERY
      - SAME_DAY_SHIPPING
      - OVERNIGHT_SHIPPING
      - MORE_THAN_1_DAY_SHIPPING
    ReorderItemsIndicator:
      type: string
      title: ReorderItemsIndicator
      description: Indicates if the transaction is a reorder
      enum:
      - FIRST_TIME_ORDER
      - REORDER
    PreOrderPurchaseIndicator:
      type: string
      title: PreOrderPurchaseIndicator
      description: Indicates if this is a pre-ordered item
      enum:
      - MERCHANDISE_AVAILABLE
      - FUTURE_AVAILABILITY
    AddressMatchLevel:
      type: string
      title: AddressMatchLevel
      description: Level of match between delivery and billing addresses
      enum:
      - FULL_MATCH
      - PARTIAL_MATCH
      - NO_MATCH
      - NOT_APPLICABLE
    MerchantRisk:
      title: MerchantRisk
      type: object
      required:
      - delivery_timeframe
      - reorder_items_indicator
      - pre_order_purchase_indicator
      - is_gift_card_purchase
      - is_deliver_address_matching_billing
      - address_match_level
      properties:
        delivery_timeframe:
          $ref: '#/components/schemas/DeliveryTimeframe'
        reorder_items_indicator:
          $ref: '#/components/schemas/ReorderItemsIndicator'
        pre_order_purchase_indicator:
          $ref: '#/components/schemas/PreOrderPurchaseIndicator'
        is_gift_card_purchase:
          type: boolean
          description: Indicates if the transaction includes a gift card
        is_delivery_address_matching_billing:
          type: boolean
          description: Indicates if delivery address matches billing address
        address_match_level:
          $ref: '#/components/schemas/AddressMatchLevel'
    Authentication:
      title: Authentication
      description: The authentication method used by the User to access their account
      type: object
      properties:
        authentication_channel:
          $ref: '#/components/schemas/ChannelType'
        possession_factor:
          $ref: '#/components/schemas/PossessionFactor'
        knowledge_factor:
          $ref: '#/components/schemas/KnowledgeFactor'
        inherence_factor:
          $ref: '#/components/schemas/InherenceFactor'
        challenge_outcome:
          type: string
          enum:
          - PASS
          - FAIL
          - NOT_PERFORMED
        authentication_flow:
          type: string
          enum:
          - MFA
          - OTHER
        authentication_value:
          type: string
          description: Cryptographic proof of authentication where supported by the device and protocol.
        challenge_date_time:
          type: string
          format: date-time
    PossessionFactor:
      title: PossessionFactor
      description: The User's possession, that only the User possesses
      type: object
      properties:
        is_used:
          type: boolean
        type:
          type: string
          enum:
          - FIDO2_SECURITY_KEY
          - PASSKEY
          - OTP_DEVICE
          - OTP_APP
          - SMS_OTP
          - EMAIL_OTP
          - PUSH_NOTIFICATION
          - WEBAUTHN_TOKEN
          - SECURE_ENCLAVE_KEY
          - HARDWARE_OTP_KEY
          - TRUSTED_DEVICE
          - OTHER
    KnowledgeFactor:
      title: KnowledgeFactor
      description: The User's knowledge, that only the User knows
      type: object
      properties:
        is_used:
          type: boolean
        type:
          type: string
          enum:
          - PIN
          - PASSWORD
          - SECURITY_QUESTION
          - SMS_OTP
          - EMAIL_OTP
          - OTP_PUSH
          - OTHER
    InherenceFactor:
      title: InherenceFactor
      description: The User's inherence, that is unique to the User's physical characteristics
      type: object
      properties:
        is_used:
          type: boolean
        type:
          $ref: '#/components/schemas/InherenceType'
    InherenceType:
      type: string
      title: InherenceType
      enum:
      - BIOMETRIC
      - FINGERPRINT
      - FACE_RECOGNITION
      - IRIS_SCAN
      - VOICE_RECOGNITION
      - FIDO_BIOMETRIC
      - DEVICE_BIOMETRICS
      - OTHER
    DeviceType:
      type: string
      title: DeviceType
      enum:
      - MOBILE
      - DESKTOP
      - TABLET
      - WEARABLE
      - OTHER
    ConnectionType:
      type: string
      title: ConnectionType
      enum:
      - WIFI
      - CELLULAR
      - OTHER
    DeviceInformation:
      title: DeviceInformation
      description: Detailed device information
      properties:
        device_id:
          type: string
          description: IMEISV number of the connected electronic device.
        alternative_device_id:
          type: string
          description: Alternative identifier for the connected electronic device.
        device_operating_system:
          type: string
