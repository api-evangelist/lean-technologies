                    bank_identifier: MOCK_KSA
                    permissions:
                      identity: true
                      accounts: true
                      balance: true
                      transactions: true
                      identities: true
                      scheduled_payments: false
                      standing_orders: false
                      direct_debits: false
                      beneficiaries: true
                    bank_type: RETAIL
                    created_at: '2025-08-05T16:57:41.64409Z'
                    consents:
                    - id: 7745b2f8-32ae-404c-b792-163f2205a83b
                      bank_consent_id: urn:INMASARI:kac-6d6cf851-6933-4801-b284-ede9639c3630
                      bank_identifier: MOCK_KSA
                      consent_type: ACCOUNT_ACCESS
                      consent_status: REVOKED
                      standard_consent_status: AUTHORISED
                      permissions:
                        identity: true
                        accounts: true
                        balance: true
                        transactions: true
                        identities: true
                        scheduled_payments: false
                        standing_orders: false
                        direct_debits: false
                        beneficiaries: true
                      creation_date_time: '2025-08-05T16:56:49.802Z'
                      status_update_date_time: '2025-09-01T00:00:05.917733Z'
                      expiration_date_time: '2025-08-31T11:28:16.667Z'
                      transaction_from_date_time: '2024-07-20T11:28:16.667Z'
                      transaction_to_date_time: '2025-08-31T11:28:16.667Z'
                      accounts:
                      - scheme_name: IBAN
                        identification: SA4420000001234567891234
                        name: MainAccount
                        secondary_identification: null
                GetAccounts_V2_UAE_Example:
