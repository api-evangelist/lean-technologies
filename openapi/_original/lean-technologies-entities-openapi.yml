                    bank_identifier: MOCK_UAE
                    permissions:
                      identity: true
                      accounts: true
                      balance: true
                      transactions: true
                      identities: false
                      scheduled_payments: false
                      standing_orders: false
                      direct_debits: false
                      beneficiaries: false
                    bank_type: RETAIL
