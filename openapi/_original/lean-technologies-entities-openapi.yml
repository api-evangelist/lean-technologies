openapi: 3.1.0
info:
  title: Lean API
  description: Lean API for entity management
  version: v2.0.0
servers:
- url: https://sandbox.leantech.me
  description: Sandbox
- url: https://api2.leantech.me
  description: Production
paths:
  /customers/v1/{customer_id}/entities/{entity_id}:
    get:
      operationId: getEntityById
      summary: Get Entity by ID
      description: 'Returns a single Entity.


        An Entity is generated whenever a Customer connects a new bank using the `.connect()` method in the LinkSDK with _any_
        data related permissions. '
      parameters:
      - name: customer_id
        in: path
        description: ''
        required: true
        schema:
          type: string
          format: uuid
      - name: entity_id
        in: path
        description: ''
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'
              examples:
                '1':
                  summary: Success
                  value:
                    id: 8d56a41f-7045-7312-a620-abe78414a143
                    customer_id: 3c70d3ed-d761-f231-5fd1-2bdeef42e46e
                    bank_identifier: MOCK_UAE
                    permissions:
                      identity: true
                      accounts: true
                      balance: false
                      transactions: true
                      identities: false
                      scheduled_payments: false
                      standing_orders: false
                      direct_debits: false
                      beneficiaries: false
                    bank_type: RETAIL
                    created_at: '2025-02-25T11:40:31.981Z'
                    consents: []
      tags:
      - Entities
    delete:
      operationId: deleteEntity
      summary: Delete Entity
      description: Marks the entity as deleted. It can be recreated later by intiating a new .connect() flow from the LinkSDK.
      parameters:
      - name: customer_id
        in: path
        description: ''
        required: true
        schema:
          type: string
          format: uuid
      - name: entity_id
        in: path
        description: ''
        required: true
        schema:
          type: string
          format: uuid
      - name: reason
        in: query
        description: Why is the entity being deleted?
        required: false
        schema:
          type: string
        x-lean-docs-discrepancy: missing
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  description: Please always pass in the value USER_REQUESTED.
                  type:
                  - string
                  - 'null'
                  const: USER_REQUESTED
              required:
              - reason
      responses:
        '200':
          description: ''
          x-lean-docs-discrepancy: response body
      deprecated: false
      tags:
      - Entities
  /customers/v1/{customer_id}/entities:
    get:
      operationId: getCustomerEntities
      summary: Get Entities for Customer
      description: An Entity is generated whenever a Customer connects a new bank using the `.connect()` method in the LinkSDK
        with _any_ data related permissions.
      parameters:
      - name: customer_id
        in: path
        description: ''
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Entity'
              examples:
                GetAccounts_V2_KSA_Example:
                  summary: Successful get entities for customer - KSA
                  value:
