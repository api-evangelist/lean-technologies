openapi: 3.0.1
info:
  title: UAE - V2
  description: ''
  version: 1.0.0
tags:
- name: Refunds
paths:
  /payouts/refunds:
    post:
      summary: Create Refunds
      deprecated: false
      description: Creates and queues a refund payment for approval or rejection. Refunds are always returned to the originating
        account of the corresponding payment. The total refund amount cannot exceed the original payment. For processing amounts
        greater than the original payment, please refer to payouts.
      operationId: createRefund
      tags:
      - Refunds
      parameters:
      - name: Content-Type
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  payment_id:
                    type: string
                    description: Unique identifier for the corresponding intitiated payment
                  amount:
                    type: integer
                    description: 'The refund amount to be processed.

                      '
                  currency:
                    type: string
                    description: The ISO 3 letter currency code for the account stores value in.
                  reason_code:
                    type: string
                    description: Code indicating the reason for the refund
                    enum:
                    - FRAUDULENT_PAYMENT
                    - ORDER_CANCELLED
                    - DUPLICATED_PAYMENT
                    - CUSTOMER_REQUEST
                  description:
                    type: string
                    description: "Additional notes about the refund being created. \nCan include order references/customer-id\
                      \ for the refund being generated."
                  external_reference:
                    type: string
                    description: Useful for tracking and reporting the transaction on your end. e.g You can enter transaction
                      ID of this refund maintained in your system
                  status:
                    type: string
                    description: Refers to the transaction status of the refund being created.
                    enum:
                    - CREATED
                    - APPROVED
                    default: CREATED
                required:
                - payment_id
                - reason_code
                - amount
            example:
            - payment_id: 00fdbc90-8116-42b2-bf26-5665b05bfb6b
              amount: 7
              currency: AED
              reason_code: DUPLICATED_PAYMENT
              description: Refund isused for Order NO. 21342322123
              external_reference: '21451234567'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    refund_id:
                      type: string
                      description: Unique identifier for the refund inititated
                    payment_id:
                      type: string
                      description: Unique identifier for the payment inititated
                    status:
                      type: string
                      description: "Status of the payment. \nDefault is INITIATED. Acceptable values: INITIATED or CONFIRMED"
                      enum:
                      - CREATED
                      - APPROVED
                      - ''
                    amount:
                      type: number
                      description: 'The refund amount to be processed.

                        '
                    currency:
                      type: string
                      description: The ISO 3 letter currency code for the refund amount
                    reason_code:
                      type: string
                      description: Code indicating the reason for the refund
                      enum:
                      - CUSTOMER_REQUEST
                      - DUPLICATED_PAYMENT
                      - ORDER_CANCELLED
                      - FRAUDULENT_PAYMENT
                    description:
                      type: string
                      description: 'Additional notes about the refund being created.

                        Can include order references/customer-id for the refund being generated'
                    external_reference:
                      type: string
                      description: Useful for tracking and reporting the transaction on your end. e.g You can enter transaction
                        ID of this refund maintained in your system
                    beneficiary:
                      type: object
                      properties:
                        name:
                          type: string
                          description: Defines the name of the benefeciary.
                        iban:
                          type: string
                          description: Defines the IBAN of the benefeciary
                        city:
                          type: string
                          description: 'Defines city of Benefeciary. Defaults to Dubai

                            '
                      required:
                      - name
                      - city
                      - iban
                  required:
                  - payment_id
                  - status
                  - amount
                  - currency
                  - description
                  - refund_id
                  - external_reference
                  - 01JKRHNSR3FP3SP1EZDFNB4FKP
                  - reason_code
              example:
              - refund_id: d7427d13-0b4c-4e67-8b23-7c9ba03d95e3
                payment_id: 00fdbc90-8116-42b2-bf26-5665b05bfb6b
                status: CREATED
                amount: 0.01
                currency: AED
                reason_code: DUPLICATED_PAYMENT
                description: Refund isused for Order NO. 21342322123
                external_reference: '21451234567'
                beneficiary:
                  name: Jay Sheron
                  iban: SA10000000000023
                  city: Dubai
          headers: {}
      security:
      - bearer: []
    put:
      summary: Process Refunds
      deprecated: false
      description: 'Updates the refund status based on the approver''s (or checker''s) confirmation or rejection. This serves
        as a fail-safe mechanism to validate the refund decision after the transaction is initiated, rather than processing
        it immediately. '
      operationId: processRefunds
      tags:
      - Refunds
      parameters:
      - name: Content-Type
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  refund_id:
                    type: string
                    description: 'Refers to the unique identity of the refund to be updated.


                      '
                  status:
                    type: string
                    description: 'Refers to the updated status of the refund. '
                    enum:
                    - APPROVED
                    - REJECTED
                required:
                - refund_id
                - status
            example:
            - refund_id: 5d43a659-a4cf-4f56-af66-ad6478d61890
              status: CONFIRMED
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  refund_id:
                    type: string
                    description: 'Refers to the unique ID of the refund being updated.

                      '
                  status:
                    type: string
                    description: 'Refers to the updated status of the refund.

                      '
                    enum:
                    - APPROVED
                    - REJECTED
                required:
                - status
                - refund_id
              example:
              - refund_id: 5d43a659-a4cf-4f56-af66-ad6478d61890
                status: REJECTED
          headers: {}
      security:
      - bearer: []
    get:
      summary: List Refunds
      deprecated: false
      description: Returns a list of all refunds intitated . You can filter the transactions based on status of the refund
        transaction by passing it in the query parameter. This API allows pagination with the default size of 50 refunds per
        page.
      operationId: listRefunds
      tags:
      - Refunds
      parameters:
      - name: status
        in: query
        description: Fetch all refund transactions based on the entered refund payment status.
        required: false
        example: ''
        schema:
          type: string
          enum:
          - CREATED
          - REJECTED
          - APPROVED
          - FAILED
          - ACCEPTED_BY_BANK
          - PENDING_WITH_BANK
      - name: size
        in: query
        description: Defines the number of transactions per page hence manages payload size
        required: false
        schema:
          type: integer
          default: 50
      - name: page
        in: query
        description: Specifies the page number to retreive. e.g if page=2 and size=50, the API will return records from 101
          to 150
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  refund_id:
                    type: string
                    description: Unique identifier for the refund transaction.
                  deposit_amount:
                    type: number
                    description: The deposit amount associated with the refund request.
                  deposit_currency:
                    type: string
                    description: The ISO 3 letter currency code for the deposit amount
                  payment_id:
                    type: string
                    description: Identifier of the payment transaction linked to this refund.
                  status:
                    type: string
                    description: Current status of the refund process.
                    enum:
                    - CREATED
                    - APPROVED
                    - REJECTED
                    - ACCEPTED_BY_BANK
                    - PENDING_WITH_BANK
                    - FAILED
                  amount:
                    type: number
                    description: The amount that will be refunded
                  currency:
                    type: string
                    description: The ISO 3 letter currency code for the refund amount
                  reason_code:
                    type: string
                    description: Reason for the refund request
                    enum:
                    - CUSTOMER_REQUEST
                    - DUPLICATED_PAYMENT
                    - ORDER_CANCELLED
                    - FRAUDULENT_PAYMENT
                  description:
                    type: string
                    description: "Additional notes about the refund being created. \nCan include order references/customer-id\
                      \ for the refund being generated."
                  external_reference:
                    type: string
                    description: Useful for tracking and reporting the transaction on your end. e.g You can enter transaction
                      ID of this refund maintained in your system
                  benefeciary:
                    type: object
                    properties:
                      name:
                        type: string
                        description: Name of the beneficiary to which refund is being processed
                      iban:
                        type: string
                        description: IBAN account details of benefeicary
                      city:
                        type: string
                        default: Dubai
                        description: City associated with the beneficiary account
                    required:
                    - city
                    - iban
                    - name
                  created_at:
                    type: string
                    format: date-time
                    description: Timestamp when the refund was created
                  created_by:
                    type: string
                    description: Identifier of the user that initiated the refund
                  actioned_by:
                    type: string
                    description: Identifier of the user that confirmed or rejected  the refund
                required:
                - created_at
                - created_by
                - refund_id
                - deposit_amount
                - deposit_currency
                - payment_id
                - status
                - amount
                - currency
                - reason_code
                - description
                - external_reference
                - benefeciary
              example:
                content:
                - refund_id: 8161d683-88f7-4c13-b4f5-1e9cb13a49c1
                  deposit_amount: 15.34
                  deposit_currency: AED
